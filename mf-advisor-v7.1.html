function aiConfig(){try{return JSON.parse(_store.get('mfa_ai_cfg')||'{}');}catch{return{};}}
function saveAiConfig(c){try{_store.set('mfa_ai_cfg',JSON.stringify(c));}catch{}}
async function aiComplete(prompt){
  const cfg=aiConfig();
  // Provider 1: built-in Claude bridge (this environment), zero key.
  if(cfg.provider==='builtin'&&window.claude&&window.claude.complete){
    return await window.claude.complete(prompt);
  }
  // Provider 2: user-supplied OpenAI-compatible endpoint (self-hosted Ollama, OpenAI, etc.)
  if(cfg.provider==='openai'&&cfg.baseUrl){
    const res=await fetch(cfg.baseUrl.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json',...(cfg.key?{Authorization:'Bearer '+cfg.key}:{})},
      body:JSON.stringify({model:cfg.model||'gpt-4o-mini',messages:[{role:'user',content:prompt}],temperature:0.4})
    });
    if(!res.ok)throw new Error('AI endpoint '+res.status);
    const j=await res.json(); return j.choices?.[0]?.message?.content||JSON.stringify(j);
  }
  throw new Error('no-ai');
}
function localAnomalies(sortedTxns,navByScheme,enabled){
  const out=[]; const seen={};
  const names=new Set([...enabled]);
  for(const t of sortedTxns){
    if(!names.has(t.scheme))continue;
    const d=t.date instanceof Date?t.date:new Date(t.date);
    const key=t.scheme+'|'+(d.toISOString().slice(0,10))+'|'+clf(t.txType)+'|'+Math.round(Math.abs(t.amount||0));
    if(seen[key])out.push({sev:'med',type:'Duplicate',msg:`Possible duplicate: ${t.scheme} · ${t.txType} · ${INR(Math.abs(t.amount||0))} on ${d.toLocaleDateString('en-IN')}`});
    seen[key]=1;
    // NAV mismatch
    const u=resolveUnits(t);
    if(t.price>0){
      const navAt=getNav(navByScheme[t.scheme],d);
      if(navAt&&Math.abs(navAt-t.price)/navAt>0.05)
        out.push({sev:'low',type:'NAV mismatch',msg:`${t.scheme}: recorded price ₹${(+t.price).toFixed(2)} differs >5% from NAV ₹${navAt.toFixed(2)} on ${d.toLocaleDateString('en-IN')}`});
    }
    if((clf(t.txType)==='buy')&&t.price<=0&&u>0)
      out.push({sev:'low',type:'Missing NAV',msg:`${t.scheme}: a purchase has no price/NAV recorded on ${d.toLocaleDateString('en-IN')}`});
  }
  return out.slice(0,40);
}
function localCommentary(fundStats,totalPortVal){
  const held=fundStats.filter(f=>f.currentVal>10);
  if(!held.length)return ['No active holdings to comment on yet. Import or add transactions to get insights.'];
  const inv=held.reduce((s,f)=>s+f.invested,0); const val=held.reduce((s,f)=>s+f.currentVal,0);
  const gain=val-inv; const gpc=inv>0?gain/inv*100:0;
  const sorted=[...held].sort((a,b)=>(b.xirr||0)-(a.xirr||0));
  const best=sorted[0], worst=sorted[sorted.length-1];
  const top=[...held].sort((a,b)=>b.currentVal-a.currentVal)[0];
  const amcMap={}; for(const f of held)amcMap[getAMC(f.name)]=(amcMap[getAMC(f.name)]||0)+f.currentVal;
  const topAmc=Object.entries(amcMap).sort((a,b)=>b[1]-a[1])[0];
  const c=[];
  c.push(`Your portfolio holds ${held.length} active funds worth ${INR(val)}, against ${INR(inv)} net invested — an overall ${gpc>=0?'gain':'loss'} of ${INR(Math.abs(gain))} (${PCT(gpc,1)}).`);
  if(best&&best.xirr!=null)c.push(`Best performer by XIRR: ${best.name} at ${PCT(best.xirr*100,1)}. Weakest: ${worst.name} at ${PCT((worst.xirr||0)*100,1)} — review whether it still fits your plan.`);
  if(top)c.push(`Largest position is ${top.name} at ${(top.currentVal/val*100).toFixed(0)}% of the portfolio${top.currentVal/val>0.3?' — that is a concentrated bet; consider trimming above 30%.':'.'}`);
  if(topAmc&&topAmc[1]/val>0.5)c.push(`⚠ ${topAmc[0]} manages ${(topAmc[1]/val*100).toFixed(0)}% of your money — single-AMC risk. Diversifying across fund houses reduces operational concentration.`);
  const losers=held.filter(f=>(f.xirr||0)<0.07);
  if(losers.length)c.push(`${losers.length} fund(s) are returning below a 7% risk-free benchmark. Underperformance over 3+ years is a reason to reassess.`);
  return c;
}
function localQuery(q,fundStats,totalPortVal){
  const s=q.toLowerCase(); const held=fundStats.filter(f=>f.currentVal>10);
  if(!held.length)return 'No active holdings yet.';
  const byX=[...held].sort((a,b)=>(b.xirr||0)-(a.xirr||0));
  const byVal=[...held].sort((a,b)=>b.currentVal-a.currentVal);
  const val=held.reduce((s2,f)=>s2+f.currentVal,0), inv=held.reduce((s2,f)=>s2+f.invested,0);
  if(/best|top|highest/.test(s)&&/xirr|return|perform/.test(s))return `Best XIRR: ${byX[0].name} at ${PCT((byX[0].xirr||0)*100,1)}.`;
  if(/worst|lowest|bottom/.test(s)&&/xirr|return|perform/.test(s))return `Lowest XIRR: ${byX[byX.length-1].name} at ${PCT((byX[byX.length-1].xirr||0)*100,1)}.`;
  if(/largest|biggest|top/.test(s)&&/hold|fund|position|invest/.test(s))return `Largest holding: ${byVal[0].name} at ${INR(byVal[0].currentVal)} (${(byVal[0].currentVal/val*100).toFixed(0)}%).`;
  if(/total/.test(s)&&/invest/.test(s))return `Total net invested: ${INR(inv)}.`;
  if(/total|portfolio/.test(s)&&/value|worth/.test(s))return `Current portfolio value: ${INR(val)}.`;
  if(/gain|profit|loss|return/.test(s))return `Overall gain: ${INR(val-inv)} (${PCT(inv>0?(val-inv)/inv*100:0,1)}).`;
  if(/how many|count|number/.test(s))return `You hold ${held.length} active funds.`;
  return null; // signal: try AI
}

/* ══════════ CLOUD SYNC — v6.5 (optional, self-hosted) ══════════ */
function SyncPanel({saveKey,currentUserId}){
  const cfgKey='mfa_sync_cfg_'+(currentUserId||'x');
  const [cfg,setCfg]=useState(()=>{try{return JSON.parse(_store.get(cfgKey)||'{}');}catch{return{};}});
  const [status,setStatus]=useState('');
  const upd=(p)=>{const n={...cfg,...p};setCfg(n);try{_store.set(cfgKey,JSON.stringify(n));}catch{}};
  const recId=cfg.recordId||(currentUserId||'me');
  const getState=()=>{try{return JSON.parse(_store.get(saveKey)||'null');}catch{return null;}};
  const endpoint=()=>{
    const base=(cfg.baseUrl||'').replace(/\/$/,'');
    if(cfg.type==='couchdb')return base+'/'+encodeURIComponent(cfg.collection||'mfadvisor')+'/'+encodeURIComponent(recId);
    if(cfg.type==='pocketbase')return base+'/api/collections/'+encodeURIComponent(cfg.collection||'mfadvisor')+'/records';
    return base+'/'+encodeURIComponent(cfg.collection||'mfadvisor')+'/'+encodeURIComponent(recId); // custom REST
  };
  const headers=()=>({'Content-Type':'application/json',...(cfg.token?{Authorization:cfg.token}:{})});
  const push=async()=>{
    const state=getState();
    if(!state){setStatus('✗ No saved portfolio to push yet');return;}
    setStatus('Pushing…');
    try{
      const payload={id:recId,data:state,updatedAt:new Date().toISOString()};
      const res=await fetch(endpoint(),{method:cfg.type==='couchdb'?'PUT':'POST',headers:headers(),body:JSON.stringify(cfg.type==='couchdb'?{_id:recId,...payload}:payload)});
      setStatus(res.ok?'✓ Pushed at '+new Date().toLocaleTimeString():'✗ '+res.status+' — check URL/auth');
    }catch(e){setStatus('✗ '+e.message+' (CORS/endpoint). Works once your server allows this origin.');}
  };
  const pull=async()=>{
    setStatus('Pulling…');
    try{
      const url=cfg.type==='pocketbase'?endpoint()+'/'+encodeURIComponent(recId):endpoint();
      const res=await fetch(url,{headers:headers()});
      if(!res.ok){setStatus('✗ '+res.status);return;}
      const j=await res.json(); const data=j.data||j.fields?.data||(j._id?j.data:j);
      if(data&&(data.transactions||data.v)){
        if(!window.confirm('Replace the portfolio on THIS device with the cloud copy?'))return;
        _store.set(saveKey,JSON.stringify(data)); try{_idb.set(saveKey,JSON.stringify(data));}catch{}
        setStatus('✓ Pulled — reloading…'); setTimeout(()=>window.location.reload(),600);
      } else setStatus('✗ No portfolio data field in response');
    }catch(e){setStatus('✗ '+e.message);}
  };
  return(
    <div id="set-sync" style={{...F_CARD(),marginTop:16}}>
      <div style={{fontFamily:'Syne',fontSize:15,fontWeight:700,color:'#fff',marginBottom:4}}>☁ Cloud Sync — optional, self-hosted</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:14,lineHeight:1.6}}>
        Sync across devices using an <b style={{color:C.text}}>open-source backend you run yourself</b> (PocketBase, CouchDB, or any REST store) — free, no subscription, your server owns the data. The app is fully usable without this; it's off until you fill it in.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
        <div>
          <label style={fLabel}>Backend type</label>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {[['pocketbase','PocketBase'],['couchdb','CouchDB'],['custom','Custom REST']].map(([k,l])=>(
              <button key={k} className="btn" onClick={()=>upd({type:k})}
                style={{padding:'6px 11px',borderRadius:6,fontSize:11,background:cfg.type===k?C.teal+'1c':'transparent',border:'1px solid '+(cfg.type===k?C.teal:C.border),color:cfg.type===k?C.teal:C.muted}}>{l}</button>
            ))}
          </div>
        </div>
        <div><label style={fLabel}>Collection / DB</label><input value={cfg.collection||''} onChange={e=>upd({collection:e.target.value})} placeholder="mfadvisor" style={{...fInput,fontFamily:'Inter'}}/></div>
        <div style={{gridColumn:'1/3'}}><label style={fLabel}>Base URL</label><input value={cfg.baseUrl||''} onChange={e=>upd({baseUrl:e.target.value})} placeholder="https://my-pocketbase.example.com" style={{...fInput,fontFamily:'Inter'}}/></div>
        <div><label style={fLabel}>Record ID</label><input value={cfg.recordId||''} onChange={e=>upd({recordId:e.target.value})} placeholder={currentUserId||'me'} style={{...fInput,fontFamily:'Inter'}}/></div>
        <div><label style={fLabel}>Auth header (optional)</label><input type="password" value={cfg.token||''} onChange={e=>upd({token:e.target.value})} placeholder="Bearer …" style={{...fInput,fontFamily:'Inter'}}/></div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <button className="btn" onClick={push} style={{padding:'8px 16px',background:C.teal+'18',border:'1px solid '+C.teal+'55',color:C.teal,borderRadius:7,fontSize:12,fontWeight:600}}>↑ Push to cloud</button>
        <button className="btn" onClick={pull} style={{padding:'8px 16px',background:C.accent+'14',border:'1px solid '+C.accent+'44',color:C.accent,borderRadius:7,fontSize:12,fontWeight:600}}>↓ Pull &amp; restore</button>
        {status&&<span style={{fontSize:11,color:status.startsWith('✓')?C.green:status.startsWith('✗')?C.red:C.muted,fontFamily:'Space Mono'}}>{status}</span>}
      </div>
      <div style={{fontSize:10,color:C.muted2,marginTop:10,lineHeight:1.6}}>Your backend must allow this page's origin (CORS). Quickstart: <code style={{color:C.teal}}>./pocketbase serve</code> → create a public collection named <code style={{color:C.teal}}>mfadvisor</code> with a JSON <code style={{color:C.teal}}>data</code> field.</div>
    </div>
  );
}


function App(){
  const [appState,setAppState]=useState('login');
  const [allTxns,setAllTxns]=useState([]);
  const [sm,setSm]=useState({});
  const [navByScheme,setNavByScheme]=useState({});
  const [country,setCountry]=useState('India');
  const [page,setPage]=useState('dashboard');
  const [benchmarks,setBenchmarks]=useState(BENCHMARKS_DEFAULT);
  const [benchmarkData,setBenchmarkData]=useState({});
  const [enabled,setEnabled]=useState(new Set());
  const [period,setPeriod]=useState({l:'52W',days:365});
  const [showExited,setShowExited]=useState(false); // exited funds deselected by default
  const [scope,setScope]=useState('current'); // G08: 'current' | 'all' (consolidate every saved portfolio)
  const [exportOpen,setExportOpen]=useState(false);
  const [exporting,setExporting]=useState(false); // lifted from FundOverviewPage — persisted
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [analyticsMap,setAnalyticsMap]=useState({});
  // Multi-user
  const [currentUserId,setCurrentUserId]=useState('');
  const [currentUserEmail,setCurrentUserEmail]=useState('');
  const [showUserMgr,setShowUserMgr]=useState(false);
  // Admin + feature flags (v6.0)
  const [flags,setFlags]=useState(()=>loadFlags());
  useEffect(()=>{saveFlags(flags);},[flags]);
  const isAdmin=isAdminEmail(currentUserEmail);
  // Display preferences
  const [displayCurrency,setDisplayCurrency]=useState('INR');
  const [displayUnit,setDisplayUnit]=useState('auto');
  const [displayFmt,setDisplayFmt]=useState({currency:'INR',scale:'auto',dec:2,neg:'minus',sep:'indian',zero:'0',custom:'',rates:{INR:1,USD:0.012,EUR:0.011,GBP:0.0094,AED:0.044,SGD:0.016}});
  const applyDisplayFmt=useCallback((f)=>{setDisplayFmt(f);setDisplayCurrency(f.currency||'INR');setDisplayUnit(f.scale||'auto');G_FMT={...f};G_CURRENCY=f.currency||'INR';G_UNIT=f.scale||'auto';},[]);
  useEffect(()=>{G_FMT={...displayFmt};G_CURRENCY=displayFmt.currency||'INR';G_UNIT=displayFmt.scale||'auto';},[displayFmt]);
  // NPV discount rate (shared between Dashboard and NPV page)
  const [returnBasis,setReturnBasis]=useState('book'); // 'book'|'net'|'gross'
  const [discountRate,setDiscountRate]=useState(7);
  // NAV refresh
  const [navRefreshInterval,setNavRefreshInterval]=useState(5); // minutes
  const [navStatus,setNavStatus]=useState('idle'); // idle|fetching|done|stale
  const [navLastFetched,setNavLastFetched]=useState(null);
  const navRefreshTimer=useRef(null);
  const navBySchemeRef=useRef(navByScheme);

  // Keep ref in sync for timer callback
  useEffect(()=>{ navBySchemeRef.current=navByScheme; },[navByScheme]);

  // Sync display globals for FMT() function
  useEffect(()=>{ G_CURRENCY=displayCurrency; G_UNIT=displayUnit; },[displayCurrency,displayUnit]);

  const today=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d;},[]);

  // ── G08: CONSOLIDATION across all saved portfolios ──────────────────
  // When scope==='all', merge transactions + NAV history from every saved
  // portfolio with the current in-memory one (deduped), so EVERY visual reflects
  // the combined picture. When scope==='current' this is inert (zero overhead).
  const consolidated=useMemo(()=>{
    if(scope!=='all')return null;
    const mergedTxns=[];const mergedNav={};const seen=new Set();
    const addTxns=(txns,tag)=>{
      for(const t of (txns||[])){
        const dt=t.date instanceof Date?t.date:new Date(t.date);
        const key=(t.isin||t.scheme)+'|'+(t.folioId||'')+'|'+(isNaN(dt)?t.date:dt.toISOString().slice(0,10))+'|'+Math.round(Math.abs(t.amount||0))+'|'+(Math.round((t.units||0)*1000));
        if(seen.has(key))continue;seen.add(key);
        mergedTxns.push({...t,date:dt,_pf:tag});
      }
    };
    const addNav=(nb)=>{for(const[k,arr]of Object.entries(nb||{})){if(!mergedNav[k]&&arr&&arr.length)mergedNav[k]=arr;}};
    // current portfolio (live, authoritative) first
    addTxns(allTxns,currentUserId);addNav(navByScheme);
    // other portfolios from storage
    for(const p of loadUsers()){
      if(p.id===currentUserId)continue;
      try{
        const raw=_store.get(getUserSaveKey(p.id));if(!raw)continue;
        const st=JSON.parse(raw);if(!st||(st.v||0)<4)continue;
        addTxns((st.transactions||[]).map(t=>({...t,date:fromISO(t.date)||new Date(t.date)})),p.id);
        // NAV: prefer the per-user nav cache, else the embedded navByScheme
        let nb={};
        try{const nr=_store.get('mfa_nav_v1_'+p.id);if(nr){const np=JSON.parse(nr);for(const[n,a]of Object.entries(np))nb[n]=a.map(x=>({d:fromISO(x.d),v:parseFloat(x.v)})).filter(x=>x.d&&x.v>0);}}catch{}
        if(!Object.keys(nb).length&&st.navByScheme){for(const[n,a]of Object.entries(st.navByScheme))nb[n]=a.map(pt=>({d:fromISO(pt.date),v:parseFloat(pt.nav)})).filter(x=>x.d&&x.v>0);}
        addNav(nb);
      }catch(e){}
    }
    const schemes=new Set(mergedTxns.map(t=>t.scheme));
    return{txns:mergedTxns,nav:mergedNav,schemes,count:loadUsers().length};
  },[scope,allTxns,navByScheme,currentUserId]);

  // Effective working set — identical to the current portfolio unless scope==='all'
  const effTxns=consolidated?consolidated.txns:allTxns;
  const effNav=consolidated?consolidated.nav:navByScheme;

  const sortedTxns=useMemo(()=>[...effTxns].sort((a,b)=>{
    const at=a.date instanceof Date?a.date.getTime():new Date(a.date).getTime();
    const bt=b.date instanceof Date?b.date.getTime():new Date(b.date).getTime();
    return at-bt;
  }),[effTxns]);
  const minDate=useMemo(()=>sortedTxns.length?sortedTxns[0].date:subYears(today,10),[sortedTxns,today]);
  const allSchemes=useMemo(()=>[...new Set(sortedTxns.map(t=>t.scheme))].filter(s=>effNav[s]),[sortedTxns,effNav]);

  // Per-fund stats for analysis page
  const fundStats=useMemo(()=>{
    const baseEnabled=consolidated?consolidated.schemes:(enabled instanceof Set?enabled:new Set(enabled));
    return Array.from(baseEnabled).map(name=>{
      const bal=schemeUnits(name,today,sortedTxns);
      const nav=getNav(effNav[name],today);
      const currentVal=nav&&bal>0.001?bal*nav:0;
      const{invested}=computeInvested(today,sortedTxns,new Set([name]));
      const x=computeXirrForScheme(name,today,null,sortedTxns,effNav);
      return{name,currentVal,invested,gain:currentVal-invested,xirr:x,exited:currentVal<10&&bal<0.001};
    }).filter(s=>s.currentVal>100||s.invested>100);
  },[enabled,consolidated,sortedTxns,effNav,today]);
  const totalPortVal=useMemo(()=>fundStats.reduce((a,f)=>a+f.currentVal,0),[fundStats]);

  // ── Background NAV refresh ──
  const getNavCacheKey=useCallback(()=>'mfa_nav_v1_'+currentUserId,[currentUserId]);
  const saveNavCache=useCallback((nb)=>{
    try{
      const s=Object.fromEntries(Object.entries(nb).map(([k,a])=>[k,a.map(p=>({d:toISO(p.d),v:p.v}))]));
      _store.set(getNavCacheKey(),JSON.stringify(s));
    }catch(e){console.warn('NAV cache:',e);}
  },[getNavCacheKey]);
  const loadNavCache=useCallback(()=>{
    try{
      const raw=_store.get(getNavCacheKey());if(!raw)return{};
      const nb={};
      for(const[name,arr] of Object.entries(JSON.parse(raw)))
        nb[name]=arr.map(x=>({d:fromISO(x.d),v:parseFloat(x.v)})).filter(x=>x.d&&x.v>0);
      return nb;
    }catch{return{};}
  },[getNavCacheKey]);
  const fetchNavBackground=useCallback(async(nb,smIn)=>{
    const cached=loadNavCache();
    const nbToUse={...cached,...(nb||navBySchemeRef.current)};
    if(isNavCurrent(nbToUse)){setNavStatus('done');return;}
    setNavStatus('fetching');
    const smMap=smIn||sm;
    const lbd=lastBusinessDay();
    const updated={...nbToUse};
    const CONCURRENCY=5;
    const schemes=Object.keys(smMap).filter(n=>smMap[n]?.amfiCode);
    let fetched=0,skipped=0;
    const fetchOne=async(name)=>{
      const code=smMap[name].amfiCode;
      const existing=updated[name];
      try{
        if(existing?.length){
          const lastDate=existing[existing.length-1].d;
          // Backfill: if history is too short for analytics (<30 points → Sharpe/Sortino
          // etc. return N/A), re-download the FULL series even if the last date is current.
          if(lastDate>=lbd&&existing.length>=30){skipped++;return;}
          if(lastDate>=lbd&&existing.length<30){
            const resF=await fetch('https://api.mfapi.in/mf/'+code,{signal:AbortSignal.timeout(12000)});
            if(resF.ok){const jF=await resF.json();if(jF?.data?.length){const arrF=buildNav(jF.data);if(arrF.length>existing.length){updated[name]=arrF;fetched++;}}}
            return;
          }
          try{
            const rL=await fetch('https://api.mfapi.in/mf/'+code+'/latest',{signal:AbortSignal.timeout(5000)});
            if(rL.ok){const jL=await rL.json();if(jL?.data?.length){const ne=buildNav(jL.data).filter(e=>e.d>lastDate);if(ne.length){updated[name]=[...existing,...ne].sort((a,b)=>a.d-b.d);fetched++;return;}}}
          }catch{}
        }
        const res=await fetch('https://api.mfapi.in/mf/'+code,{signal:AbortSignal.timeout(12000)});
        if(!res.ok)return;
        const json=await res.json();
        if(json?.data?.length){const arr=buildNav(json.data);if(arr.length){updated[name]=arr;fetched++;}}
      }catch{}
    };
    for(let i=0;i<schemes.length;i+=CONCURRENCY){
      await Promise.all(schemes.slice(i,i+CONCURRENCY).map(fetchOne));
      setNavByScheme({...updated});
      navBySchemeRef.current={...updated};
      saveNavCache({...updated});
    }
    setNavLastFetched(new Date());
    setNavStatus(isNavCurrent(updated)?'done':'stale');
    console.log('NAV: '+fetched+' updated, '+skipped+' current');
  },[sm,loadNavCache,saveNavCache]);

  // F110/v6.1: Google Drive AUTO-IMPORT after sign-in.
  // When a Google session is active and this portfolio has no local data yet,
  // pull the saved portfolio (mfa-<userId>.json) straight from the user's Drive
  // so re-logging in on a new device restores everything. Best-effort + safe:
  // any failure silently falls through to the normal upload screen.
  const [gdRestore,setGdRestore]=useState('');
  const gdTriedRef=useRef('');
  useEffect(()=>{
    if(appState!=='setup'||!currentUserId)return;
    if(gdTriedRef.current===currentUserId)return; // only once per portfolio
    let tok=null;try{tok=JSON.parse(_store.get('mfa_gd_token')||'null');}catch{tok=null;}
    if(!tok||!tok.tok||(tok.exp&&tok.exp<Date.now()))return; // no live Google session
    gdTriedRef.current=currentUserId;
    let cancelled=false;
    (async()=>{
      setGdRestore('checking');
      try{
        const filename='mfa-'+currentUserId+'.json';
        const q=encodeURIComponent("name='"+filename+"' and trashed=false");
        const lr=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&pageSize=5&orderBy=modifiedTime desc',
          {headers:{Authorization:'Bearer '+tok.tok}});
        if(!lr.ok){setGdRestore('');return;}
        const lj=await lr.json();
        if(!lj.files||!lj.files.length){setGdRestore('');return;}
        const dr=await fetch('https://www.googleapis.com/drive/v3/files/'+lj.files[0].id+'?alt=media',
          {headers:{Authorization:'Bearer '+tok.tok}});
        if(!dr.ok){setGdRestore('');return;}
        const data=JSON.parse(await dr.text());
        if(cancelled||!data||!data.transactions){setGdRestore('');return;}
        setGdRestore('restoring');
        onImportFromJSON(data); // applies everything and switches to the app
      }catch(e){setGdRestore('');}
    })();
    return()=>{cancelled=true;};
  },[appState,currentUserId]);

      req.onupgradeneeded=e=>e.target.result.createObjectStore('handles');
      req.onsuccess=e=>{
        const db=e.target.result;
        const tx=db.transaction('handles','readonly');
        const store=tx.objectStore('handles');
        const get=store.get('defaultDir');
        get.onsuccess=async()=>{
          if(get.result){
            try{
              const perm=await get.result.queryPermission({mode:'readwrite'});
              if(perm==='granted'||perm==='prompt'){
                setFsHandle(get.result);
                // Auto-load latest backup from folder if no data yet
                if(appState==='setup'){
                  try{
                    const files=[];
                    for await(const entry of get.result.values()){
                      if(entry.kind==='file'&&entry.name.startsWith('mf-advisor_')&&entry.name.endsWith('.json'))
                        files.push(entry);
                    }
                    files.sort((a,b)=>b.name.localeCompare(a.name)); // newest first
                    if(files.length>0){
                      const file=await files[0].getFile();
                      const text=await file.text();
                      const data=JSON.parse(text);
                      if(data.transactions?.length){
                        setFolderAutoFile({name:files[0].name,data,count:files.length});
                      }
                    }
                  }catch(e2){console.warn('Folder auto-scan failed:',e2);}
                }
              }
            }catch{}
          }
        };
      };
    }catch{}
  },[]);

          </ErrorBoundary>
          <ErrorBoundary name="Insights">
          {page==='insights'&&(
            <InsightsPage fundStats={fundStats} totalPortVal={totalPortVal}
              sortedTxns={sortedTxns} navByScheme={effNav} enabled={filteredEnabledSet}/>
          )}
          </ErrorBoundary>
          <ErrorBoundary name="Reports">
          {page==='reports'&&<ReportsPage getExportData={getExportData} onPrint={()=>doExportHTML(true)}/>}
          </ErrorBoundary>
          <ErrorBoundary name="Admin">
          {page==='admin'&&isAdmin&&(
            <AdminConsolePage
              currentUserEmail={currentUserEmail}
              flags={flags}
              setFlags={setFlags}
              goSettings={()=>setPage('settings')}
              onRevokeAdmin={()=>{try{_store.remove('mfa_admin_grant');}catch{}setPage('dashboard');window.location.reload();}}/>
          )}
          </ErrorBoundary>
          <ErrorBoundary name="Compare">
          {page==='compare'&&(
            <PortfolioComparePage
              currentUserId={currentUserId}
              returnBasis={returnBasis}
              navByScheme={navByScheme}
              sortedTxns={sortedTxns}
              today={today}/>
          )}
          </ErrorBoundary>
          <ErrorBoundary name="Settings">
          {page==='settings'&&(
            <SettingsPage
              allTxns={allTxns}
              setAllTxns={setAllTxns}
              sm={sm}
              setSm={setSm}
              navByScheme={navByScheme}
              setNavByScheme={setNavByScheme}
              benchmarks={benchmarks}
              setBenchmarks={setBenchmarks}
              country={country}
              setCountry={setCountry}
              displayCurrency={displayCurrency}
              setDisplayCurrency={setDisplayCurrency}
              displayUnit={displayUnit}
              setDisplayUnit={setDisplayUnit}
              displayFmt={displayFmt}
              applyDisplayFmt={applyDisplayFmt}
              returnBasis={returnBasis}
              setReturnBasis={setReturnBasis}
              currentUserId={currentUserId}
              navRefreshInterval={navRefreshInterval}
              setNavRefreshInterval={setNavRefreshInterval}
              navStatus={navStatus}
              navLastFetched={navLastFetched}
              onRefreshNow={()=>fetchNavBackground(null,null)}
              onNewAnalysis={onReset}
              analyticsMap={analyticsMap}
              fsHandle={fsHandle}
              pickFolder={pickFolder}
              saveToFolder={saveToFolder}
              fsStatus={fsStatus}
              benchmarkData={benchmarkData}
              setEnabled={setEnabled}
              setShowExited={setShowExited}
              onFullRestore={onImportFromJSON}
              getFullState={buildFullState}/>
          )}
          {page==='settings'&&(
            <div style={{padding:'0 24px 28px',maxWidth:980}}>
              <div id="set-autobackup" style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'16px 18px',marginTop:16}}>
                <div style={{fontFamily:'Syne',fontSize:15,fontWeight:700,color:'#fff',marginBottom:4}}>⏱ Scheduled folder backup</div>
                <div style={{fontSize:11,color:C.muted,marginBottom:12,lineHeight:1.6}}>
                  {fsHandle?<>Auto-writes a timestamped JSON backup to <b style={{color:C.teal}}>{fsHandle.name}</b> at the chosen interval. Put that folder in Drive/Dropbox/iCloud desktop sync for off-device copies — no API key.</>:<>Set a default folder in <b style={{color:C.text}}>Data Management</b> above first, then choose an interval here.</>}
                </div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {[[0,'Off'],[5,'5 min'],[15,'15 min'],[30,'30 min'],[60,'1 hour']].map(([m,l])=>(
                    <button key={m} className="btn" disabled={!fsHandle&&m!==0} onClick={()=>setFolderAutoMin(m)}
                      style={{padding:'7px 13px',borderRadius:7,fontSize:11,opacity:(!fsHandle&&m!==0)?0.4:1,
                        background:folderAutoMin===m?C.teal+'1c':'transparent',border:'1px solid '+(folderAutoMin===m?C.teal:C.border),color:folderAutoMin===m?C.teal:C.muted}}>{l}</button>
                  ))}
                </div>
              </div>
              <SyncPanel saveKey={getUserSaveKey(currentUserId)} currentUserId={currentUserId}/>
            </div>
          )}
          </ErrorBoundary>
        </div>
      </div>
    )}
    {/* Export Report Modal */}
    {showExportModal&&(
      <ExportReportModal
        onClose={()=>setShowExportModal(false)}
        appData={{
          allTxns,sortedTxns,navByScheme,enabled:enabledSet,
          benchmarks,benchmarkData,analyticsMap,sm,
          displayCurrency,discountRate,period,country,
          fundStats,totalPortVal,today,
        }}/>
    )}
  </div>
  );
}

class RootErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return React.createElement('div',{style:{padding:32,fontFamily:'Space Mono',color:'#ff5252',background:'#04080f',minHeight:'100vh'}},
      React.createElement('div',{style:{fontSize:18,fontWeight:700,marginBottom:8}},'⚠ Application Error'),
      React.createElement('div',{style:{fontSize:12,marginBottom:12}},String(this.state.err.message||this.state.err)),
      React.createElement('button',{onClick:()=>{try{_store.remove('mfa_active_user');}catch{}window.location.reload();},
        style:{padding:'8px 20px',background:'#ff525222',border:'1px solid #ff5252',color:'#ff5252',borderRadius:6,cursor:'pointer',fontSize:13}},'Reload App'),
      React.createElement('div',{style:{marginTop:8,fontSize:11,color:'#607080'}},'Open DevTools (F12) for details.')
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(RootErrorBoundary,null,React.createElement(App,null)));
</script>

<script>
// PWA Install — Android Chrome/Edge: shows "Install App" button in header
let pwaPrompt=null;
// F128: offline service worker (best-effort). Caches the app shell + CDN deps so
// the app opens offline after the first visit. Works in a secure context (https
// or localhost); silently no-ops on file:// or where SW is unavailable.
(function registerSW(){
  try{
    if(!('serviceWorker' in navigator))return;
    if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
    const swSrc=`
      const CACHE='mfadvisor-v6.1';
      self.addEventListener('install',e=>{self.skipWaiting();});
      self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});
      self.addEventListener('fetch',e=>{
        const req=e.request;
        if(req.method!=='GET')return;
        e.respondWith(
          caches.open(CACHE).then(c=>
            c.match(req).then(hit=>{
              const net=fetch(req).then(res=>{
                if(res&&res.status===200&&(req.url.startsWith('http')))c.put(req,res.clone());
                return res;
              }).catch(()=>hit);
              return hit||net;
            })
          )
        );
      });`;
    const url=URL.createObjectURL(new Blob([swSrc],{type:'text/javascript'}));
    navigator.serviceWorker.register(url).catch(()=>{/* blob SW blocked here; host a sw.js for full offline */});
  }catch(e){/* offline shell unavailable — app still works online */}
})();
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();pwaPrompt=e;
  const btn=document.getElementById('pwa-install-btn');
  if(btn){
    btn.style.display='';
    btn.onclick=async()=>{
      if(!pwaPrompt)return;
      pwaPrompt.prompt();
      const{outcome}=await pwaPrompt.userChoice;
      if(outcome==='accepted'){btn.style.display='none';pwaPrompt=null;}
    };
  }
});
// iOS Safari: no beforeinstallprompt — show one-time tip after 3s
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase())&&!window.MSStream;
const inStandalone=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone;
if(isIOS&&!inStandalone&&!sessionStorage.getItem('mfa-ios-tip')){
  sessionStorage.setItem('mfa-ios-tip','1');
  setTimeout(()=>{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d1f38;border:1px solid #00c8ff55;color:#cdd9f0;padding:14px 20px;border-radius:12px;font-size:12px;z-index:9999;text-align:center;max-width:300px;box-shadow:0 4px 24px #00000099;line-height:1.6;';
    d.innerHTML='📲 <strong style="color:#00c8ff">Install MF Advisor on iPhone/iPad:</strong><br>Tap <strong>Share ⬆</strong> → <strong>Add to Home Screen</strong><br><button onclick="this.parentNode.remove()" style="margin-top:10px;padding:5px 14px;background:#00c8ff18;border:1px solid #00c8ff44;color:#00c8ff;border-radius:5px;font-size:11px;cursor:pointer;">Got it ✓</button>';
    document.body.appendChild(d);
    setTimeout(()=>{if(d.parentNode)d.remove();},15000);
  },3000);
}
</script>
