}



function PortfolioDiagnostic({allTxns,navByScheme}){
  const [diagSearch,setDiagSearch]=useState('');
  const [diagSort,setDiagSort]=useState({col:'scheme',dir:1});
  const [diagGroup,setDiagGroup]=useState('none');
  const sortDiag=(col)=>setDiagSort(p=>({col,dir:p.col===col?-p.dir:1}));

  const d=useMemo(()=>{const x=new Date();x.setHours(0,0,0,0);return x;},[]);

  const allRows=useMemo(()=>{
    const balMap={};
    for(const t of allTxns){
      const tT=t.date instanceof Date?t.date.getTime():new Date(t.date).getTime();
      if(tT>d.getTime())break;
      const k=`${t.scheme}||${t.folioId??'?'}`;
      if(!balMap[k])balMap[k]={scheme:t.scheme,folioId:t.folioId??'?',bal:0};
      if(t.source==='import'){balMap[k].bal=t.balUnits??0;}
      else{const sign=unitSign(t.txType);if(sign!==0){const u=resolveUnits(t);if(u>0.00001)balMap[k].bal+=sign*u;}}
    }
    return Object.values(balMap).filter(e=>e.bal>0.001).map(e=>{
      const n=getNav(navByScheme[e.scheme],d);
      const val=n?e.bal*n:0;
      const navDate=navByScheme[e.scheme]?.length?(()=>{
        const arr=navByScheme[e.scheme];let lo=0,hi=arr.length-1;
        while(lo<=hi){const m=(lo+hi)>>1;arr[m].d<=d?(lo=m+1):(hi=m-1);}
        return hi>=0?fmtD(arr[hi].d):'—';
      })():'—';
      return{...e,n,val,navDate};
    });
  },[allTxns,navByScheme,d]);

  const trows=useMemo(()=>{
    let rows=allRows;
    if(diagSearch)rows=rows.filter(e=>e.scheme.toLowerCase().includes(diagSearch.toLowerCase())||e.folioId.toLowerCase().includes(diagSearch.toLowerCase()));
    return [...rows].sort((a,b)=>{
      const{col,dir}=diagSort;
      if(col==='scheme')return dir*a.scheme.localeCompare(b.scheme);
      if(col==='folio')return dir*a.folioId.localeCompare(b.folioId);
      if(col==='bal')return dir*(a.bal-b.bal);
      if(col==='nav')return dir*((a.n||0)-(b.n||0));
      if(col==='val')return dir*(a.val-b.val);
      return 0;
    });
  },[allRows,diagSearch,diagSort]);

  const gt=useMemo(()=>trows.reduce((s,r)=>s+r.val,0),[trows]);

  const SH=({col,label,align='right'})=>(
    <th onClick={()=>sortDiag(col)} style={{padding:'5px 8px',textAlign:align,color:diagSort.col===col?C.accent:C.muted,fontFamily:'Space Mono',fontSize:9,whiteSpace:'nowrap',cursor:'pointer',userSelect:'none'}}>
      {label}{diagSort.col===col?(diagSort.dir>0?' ▲':' ▼'):''}
    </th>
  );

  let bodyContent;
  if(diagGroup!=='none'){
    const gKey=r=>diagGroup==='fund'?r.scheme:r.folioId;
    const groups={};
    trows.forEach(r=>{const k=gKey(r);if(!groups[k])groups[k]=[];groups[k].push(r);});
    bodyContent=Object.entries(groups).map(([gk,rows])=>{
      const gv=rows.reduce((s,r)=>s+r.val,0);
      return(<React.Fragment key={gk}>
        <tr style={{background:`${C.accent}18`,borderTop:`1px solid ${C.border}`}}>
          <td colSpan="4" style={{padding:'5px 8px',fontFamily:'Syne',fontWeight:700,color:C.accent,fontSize:10}}>{gk}</td>
          <td style={{padding:'5px 8px',textAlign:'right',fontFamily:'Space Mono',fontSize:9,color:C.muted}}>{rows.reduce((s,r)=>s+r.bal,0).toFixed(3)}</td>
          <td style={{padding:'5px 8px',textAlign:'right',fontFamily:'Space Mono',fontWeight:700,color:C.green,fontSize:10}}>{FMT(gv)}</td>
        </tr>
        {rows.map((e,i)=>(
          <tr key={i} style={{borderBottom:`1px solid ${C.border}11`}}>
            <td style={{padding:'3px 8px 3px 20px',maxWidth:190,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:C.muted,fontSize:10}}>{e.scheme}</td>
            <td style={{padding:'3px 8px',color:C.muted2,fontSize:10}}>{e.folioId}</td>
            <td style={{padding:'3px 8px',textAlign:'right',fontFamily:'Space Mono',fontSize:10}}>{numFmt(e.bal,3)}</td>
            <td style={{padding:'3px 8px',textAlign:'right',color:C.muted,fontFamily:'Space Mono',fontSize:9}}>{e.navDate}</td>
            <td style={{padding:'3px 8px',textAlign:'right',fontFamily:'Space Mono',fontSize:10}}>{e.n?`₹${e.n.toFixed(3)}`:'—'}</td>
            <td style={{padding:'3px 8px',textAlign:'right',color:C.green,fontFamily:'Space Mono',fontSize:10}}>{FMT(e.val)}</td>
          </tr>
        ))}
      </React.Fragment>);
    });
  } else {
    bodyContent=trows.map((e,i)=>(
      <tr key={i} style={{borderBottom:`1px solid ${C.border}22`}}>
        <td style={{padding:'3px 8px',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.scheme}</td>
        <td style={{padding:'3px 8px',color:C.muted2}}>{e.folioId}</td>
        <td style={{padding:'3px 8px',textAlign:'right',fontFamily:'Space Mono'}}>{numFmt(e.bal,3)}</td>
        <td style={{padding:'3px 8px',textAlign:'right',color:C.muted,fontFamily:'Space Mono',fontSize:9}}>{e.navDate}</td>
        <td style={{padding:'3px 8px',textAlign:'right',fontFamily:'Space Mono'}}>{e.n?`₹${e.n.toFixed(3)}`:'—'}</td>
        <td style={{padding:'3px 8px',textAlign:'right',color:C.green,fontFamily:'Space Mono'}}>{FMT(e.val)}</td>
      </tr>
    ));
  }

  return(
    <CollapsibleCard id="settings-diag" title="Portfolio Diagnostic" subtitle="Folio-level unit balance · filter · sort · group" defaultOpen={false}>
      <div style={{fontSize:10,color:C.amber,marginBottom:10,padding:'6px 10px',background:`${C.amber}10`,border:`1px solid ${C.amber}22`,borderRadius:6}}>
        Each row = one folio of one fund. Sum of all rows = portfolio value.
      </div>
      <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap',alignItems:'center'}}>
        <input value={diagSearch} onChange={e=>setDiagSearch(e.target.value)} placeholder="Filter by fund name…"
          style={{flex:'1 1 180px',padding:'5px 10px',background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,color:'#fff',fontSize:11}}/>
        <select value={diagGroup} onChange={e=>setDiagGroup(e.target.value)}
          style={{padding:'5px 10px',background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,color:C.accent,fontSize:11}}>
          <option value="none">No grouping</option>
          <option value="fund">Group by Fund</option>
          <option value="folio">Group by Folio</option>
        </select>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:10}}>
          <thead><tr style={{background:C.surface}}>
            <SH col="scheme" label="Scheme" align="left"/>
            <SH col="folio" label="Folio" align="left"/>
            <SH col="bal" label="Bal Units"/>
            <th style={{padding:'5px 8px',textAlign:'right',color:C.muted,fontFamily:'Space Mono',fontSize:9}}>NAV Date</th>
            <SH col="nav" label="Last NAV"/>
            <SH col="val" label="Value"/>
          </tr></thead>
          <tbody>{bodyContent}</tbody>
          <tfoot><tr style={{borderTop:`2px solid ${C.border}`,fontWeight:700}}>
            <td colSpan="5" style={{padding:'4px 8px',color:C.accent,fontFamily:'Space Mono'}}>TOTAL ({trows.length} rows{diagSearch?', filtered':''})</td>
            <td style={{padding:'4px 8px',textAlign:'right',color:C.accent,fontFamily:'Space Mono'}}>{FMT(gt)}</td>
          </tr></tfoot>
        </table>
      </div>
      <button className="btn" onClick={()=>{
        const hdrs=['Scheme','Folio ID','Balance Units','Last NAV','NAV Date','Value'];
        const data=trows.map(e=>[e.scheme,e.folioId,e.bal,e.n??'',e.navDate,e.val]);
        downloadCSV(data,hdrs,`folio-diagnostic_${toTS()}`);
      }} style={{marginTop:8,padding:'5px 12px',background:`${C.accent}15`,border:`1px solid ${C.accent}44`,color:C.accent,borderRadius:5,fontSize:10}}>
        ↓ Export CSV
      </button>
    </CollapsibleCard>
  );
}

// ── Portfolio Compare Page ──────────────────────────────────────
function PortfolioComparePage({currentUserId,returnBasis,navByScheme:curNav,sortedTxns:curTxns,today}){
  // C is the global color palette (module-level const)
  const [rows,setRows]=React.useState([]);
  const [perScheme,setPerScheme]=React.useState([]);
  const [consolidated,setConsolidated]=React.useState(null);
  const [loading,setLoading]=React.useState(true);

  React.useEffect(()=>{
    const portfolios=loadUsers();
    const today2=new Date();today2.setHours(0,0,0,0);
    const results=[];
    const schemeMap={}; // scheme -> { portId -> {value,invested,units} }
    for(const p of portfolios){
      try{
        let txns=[],nb={},schemeMappingP={},name=p.name;
        if(p.id===currentUserId){
          // Use live in-memory data for current portfolio
          txns=curTxns||[];
          nb=curNav||{};
        } else {
          // Load from _store
          const raw=_store.get(getUserSaveKey(p.id));
          if(!raw)continue;
          const state=JSON.parse(raw);
          if(!state?.v||state.v<4)continue;
          txns=state.transactions.map(t=>({...t,date:fromISO(t.date)||new Date(t.date)}))
            .sort((a,b)=>(a.date instanceof Date?a.date:new Date(a.date))-(b.date instanceof Date?b.date:new Date(b.date)));
          // Restore NAV cache
          try{const nr=_store.get('mfa_nav_v1_'+p.id);if(nr){const np=JSON.parse(nr);for(const[n,a] of Object.entries(np))nb[n]=a.map(x=>({d:fromISO(x.d),v:parseFloat(x.v)})).filter(x=>x.d&&x.v>0);}}catch{}
          if(!Object.keys(nb).length&&state.navByScheme){for(const[n,a]of Object.entries(state.navByScheme))nb[n]=a.map(pt=>({d:fromISO(pt.date),v:parseFloat(pt.nav)})).filter(x=>x.d&&x.v>0);}
          schemeMappingP=state.schemeMapping||{};
        }
        const enabledSet=new Set(txns.map(t=>t.scheme));
        const pv=portVal(today2,txns,nb,enabledSet);
        const{invested,redeemed,net}=computeInvested(today2,txns,enabledSet);
        let bookCost=0;
        for(const n of enabledSet){bookCost+=computeFIFO(n,today2,txns).costBasis;}
        const xirr=computePortfolioXirr(today2,null,txns,nb,enabledSet).x;
        const gain=returnBasis==='gross'?pv-invested:returnBasis==='net'?pv-net:pv-bookCost;
        const base=returnBasis==='gross'?invested:returnBasis==='net'?net:bookCost;
        const gainPct=base!==0?gain/Math.abs(base)*100:0;
        const txCount=txns.length;
        const schemeCount=enabledSet.size;
        // Per-scheme value/invested for the cross-portfolio matrix
        const fundVals=[];
        for(const n of enabledSet){
          const bal=schemeUnits(n,today2,txns);
          const nav=getNav(nb[n],today2);
          const val=nav&&bal>0.001?bal*nav:0;
          const inv=computeInvested(today2,txns,new Set([n])).invested;
          if(val>1||inv>1){
            schemeMap[n]=schemeMap[n]||{};
            schemeMap[n][p.id]={value:val,invested:inv,units:bal};
            fundVals.push({name:n,val});
          }
        }
        fundVals.sort((a,b)=>b.val-a.val);
        results.push({id:p.id,name,pv,invested,redeemed,net,bookCost,gain,gainPct,xirr,txCount,schemeCount,topFunds:fundVals.slice(0,3),isCurrent:p.id===currentUserId});
      }catch(e){console.warn('Compare load failed for',p.name,e);}
    }
    // Consolidated totals across all portfolios
    if(results.length){
      const sum=k=>results.reduce((s,r)=>s+(r[k]||0),0);
      const pvT=sum('pv'),invT=sum('invested'),netT=sum('net'),bookT=sum('bookCost'),redT=sum('redeemed');
      const gainT=returnBasis==='gross'?pvT-invT:returnBasis==='net'?pvT-netT:pvT-bookT;
      const baseT=returnBasis==='gross'?invT:returnBasis==='net'?netT:bookT;
      // value-weighted blended XIRR (approximation; exact needs merged cashflows)
      const wsum=results.reduce((s,r)=>s+(r.xirr!=null?r.xirr*r.pv:0),0);
      const wden=results.reduce((s,r)=>s+(r.xirr!=null?r.pv:0),0);
      setConsolidated({pv:pvT,invested:invT,redeemed:redT,net:netT,bookCost:bookT,gain:gainT,
        gainPct:baseT!==0?gainT/Math.abs(baseT)*100:0,xirr:wden>0?wsum/wden:null,
        txCount:sum('txCount'),schemeCount:Object.keys(schemeMap).length,portfolios:results.length});
    }
    // Per-scheme matrix rows
    const portList=results.map(r=>({id:r.id,name:r.name}));
    const ps=Object.entries(schemeMap).map(([scheme,byPort])=>{
      const totVal=Object.values(byPort).reduce((s,x)=>s+x.value,0);
      const totInv=Object.values(byPort).reduce((s,x)=>s+x.invested,0);
      return{scheme,byPort,totVal,totInv,gain:totVal-totInv,count:Object.keys(byPort).length};
    }).sort((a,b)=>b.totVal-a.totVal);
    ps._ports=portList;
    setRows(results);setPerScheme(ps);setLoading(false);
  },[currentUserId,returnBasis]);

  if(loading)return <div style={{padding:32,color:C.muted,fontFamily:'Space Mono',fontSize:13}}>Loading portfolios…</div>;
  if(!rows.length)return <div style={{padding:32,color:C.muted,fontSize:13}}>No portfolio data found.</div>;

  const gc=v=>v==null?C.muted:v>=0?C.green:C.red;
  const basisLabel=returnBasis==='gross'?'Gross':returnBasis==='net'?'Net Dep':'Book Cost';

  return(
    <div style={{padding:'20px 24px',overflowX:'auto'}}>
      <div style={{fontFamily:'Syne',fontSize:18,fontWeight:800,color:'#fff',marginBottom:4}}>Portfolio Compare</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:20}}>
        Side-by-side snapshot · {rows.length} portfolios · Return basis: <span style={{color:C.accent}}>{basisLabel}</span>
      </div>

      {/* Summary cards row */}
      <div style={{display:'grid',gridTemplateColumns:`repeat(${rows.length},minmax(220px,1fr))`,gap:12,marginBottom:28}}>
        {rows.map(r=>(
          <div key={r.id} style={{background:r.isCurrent?`${C.accent}10`:C.card,border:`1px solid ${r.isCurrent?C.accent:C.border}`,borderRadius:12,padding:'16px 18px'}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
              <span style={{fontSize:13,fontFamily:'Syne',fontWeight:700,color:r.isCurrent?C.accent:'#fff',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</span>
              {r.isCurrent&&<span style={{fontSize:9,color:C.accent,border:`1px solid ${C.accent}44`,borderRadius:3,padding:'1px 5px',whiteSpace:'nowrap'}}>active</span>}
            </div>
            {[
              ['Portfolio Value',FMT(r.pv),C.accent],
              ['Gross Invested', FMT(r.invested),C.text],
              ['Redeemed',       r.redeemed>0?FMT(r.redeemed):'—',C.muted],
              ['Net Deployed',   FMT(r.net),r.net>=0?C.text:C.amber],
              ['Book Cost (FIFO)',FMT(r.bookCost),C.text],
              [`Gain (${basisLabel})`,FMT(r.gain),gc(r.gain)],
              ['Gain %',         r.gainPct!=null?(r.gainPct>=0?'+':'')+r.gainPct.toFixed(1)+'%':'—',gc(r.gainPct)],
              ['All-Time XIRR',  r.xirr!=null?(r.xirr*100>=0?'+':'')+  (r.xirr*100).toFixed(1)+'% p.a.':'—',gc(r.xirr)],
              ['Transactions',   r.txCount.toLocaleString(),C.muted],
              ['Funds',          r.schemeCount,C.muted],
            ].map(([lbl,val,col])=>(
              <div key={lbl} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:`1px solid ${C.border}18`}}>
                <span style={{fontSize:10,color:C.muted}}>{lbl}</span>
                <span style={{fontSize:11,fontFamily:'Space Mono',color:col,fontWeight:600}}>{val}</span>
              </div>
            ))}
            {r.topFunds.length>0&&(
              <div style={{marginTop:10}}>
                <div style={{fontSize:9,color:C.muted,fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:4}}>Top Holdings</div>
                {r.topFunds.map(f=>(
                  <div key={f.name} style={{display:'flex',justifyContent:'space-between',padding:'2px 0'}}>
                    <span style={{fontSize:10,color:C.text,maxWidth:'65%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name.split('-')[0].trim()}</span>
                    <span style={{fontSize:10,fontFamily:'Space Mono',color:C.accent}}>{FMT(f.val)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Comparison table */}
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
          <thead>
            <tr style={{background:C.surface}}>
              <th style={{padding:'8px 12px',textAlign:'left',color:C.muted,fontFamily:'Space Mono',fontSize:10,borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>Metric</th>
              {rows.map(r=>(
                <th key={r.id} style={{padding:'8px 12px',textAlign:'right',color:r.isCurrent?C.accent:C.muted,fontFamily:'Syne',fontSize:11,fontWeight:600,borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>
                  {r.name}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {[
              {label:'Portfolio Value',      fmt:r=>FMT(r.pv),          col:r=>C.accent},
              {label:'Gross Invested',       fmt:r=>FMT(r.invested),     col:()=>C.text},
              {label:'Redeemed',             fmt:r=>r.redeemed>0?FMT(r.redeemed):'—', col:()=>C.muted},
              {label:'Net Deployed',         fmt:r=>FMT(r.net),          col:r=>r.net>=0?C.text:C.amber},
              {label:'Book Cost (FIFO)',     fmt:r=>FMT(r.bookCost),     col:()=>C.text},
              {label:`Gain (${basisLabel})`, fmt:r=>FMT(r.gain),         col:r=>gc(r.gain)},
              {label:'Gain %',               fmt:r=>r.gainPct!=null?(r.gainPct>=0?'+':'')+r.gainPct.toFixed(1)+'%':'—', col:r=>gc(r.gainPct)},
              {label:'All-Time XIRR',        fmt:r=>r.xirr!=null?(r.xirr*100>=0?'+':'')+(r.xirr*100).toFixed(1)+'% p.a.':'—', col:r=>gc(r.xirr)},
              {label:'Funds',                fmt:r=>r.schemeCount,       col:()=>C.text},
              {label:'Transactions',         fmt:r=>r.txCount.toLocaleString(), col:()=>C.muted},
            ].map(({label,fmt,col},ri)=>(
              <tr key={label} style={{background:ri%2===0?C.card:'transparent',borderBottom:`1px solid ${C.border}22`}}>
                <td style={{padding:'7px 12px',color:C.muted,fontWeight:600}}>{label}</td>
                {rows.map(r=>(
                  <td key={r.id} style={{padding:'7px 12px',textAlign:'right',fontFamily:'Space Mono',color:col(r),fontWeight:600}}>{fmt(r)}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Consolidated total across all portfolios */}
      {consolidated&&(
        <div style={{marginTop:8,marginBottom:24,background:`${C.green}0c`,border:`1px solid ${C.green}44`,borderRadius:12,padding:'16px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div style={{fontFamily:'Syne',fontSize:15,fontWeight:800,color:C.green}}>⊕ Consolidated — all {consolidated.portfolios} portfolios combined</div>
            <button className="btn" onClick={()=>{
              const hdr=['Metric','Value'];
              const d=[['Portfolio Value',Math.round(consolidated.pv)],['Gross Invested',Math.round(consolidated.invested)],['Redeemed',Math.round(consolidated.redeemed)],['Net Deployed',Math.round(consolidated.net)],['Book Cost (FIFO)',Math.round(consolidated.bookCost)],[`Gain (${basisLabel})`,Math.round(consolidated.gain)],['Gain %',+consolidated.gainPct.toFixed(2)],['Blended XIRR %',consolidated.xirr!=null?+(consolidated.xirr*100).toFixed(2):''],['Distinct funds',consolidated.schemeCount],['Transactions',consolidated.txCount]];
              downloadXLSX(d,hdr,'consolidated-summary.xlsx','Consolidated');
            }} style={{padding:'4px 11px',background:'transparent',border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,fontSize:10}}>↓ Excel</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10}}>
            {[
              ['Total Value',FMT(consolidated.pv),C.green],
              ['Gross Invested',FMT(consolidated.invested),C.text],
              ['Net Deployed',FMT(consolidated.net),C.text],
              [`Gain (${basisLabel})`,FMT(consolidated.gain),gc(consolidated.gain)],
              ['Gain %',(consolidated.gainPct>=0?'+':'')+consolidated.gainPct.toFixed(1)+'%',gc(consolidated.gainPct)],
              ['Blended XIRR',consolidated.xirr!=null?(consolidated.xirr*100>=0?'+':'')+(consolidated.xirr*100).toFixed(1)+'%':'—',gc(consolidated.xirr)],
              ['Distinct Funds',consolidated.schemeCount,C.muted],
              ['Transactions',consolidated.txCount.toLocaleString(),C.muted],
            ].map(([l,v,col])=>(
              <div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:9,padding:'10px 12px'}}>
                <div style={{fontSize:9,color:C.muted}}>{l}</div>
                <div style={{fontFamily:'Space Mono',fontSize:15,fontWeight:700,color:col,marginTop:2}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:9,color:C.muted2,marginTop:8}}>Blended XIRR is portfolio-value-weighted (approximation). Same fund held in multiple portfolios is aggregated in the matrix below.</div>
        </div>
      )}

      {/* Per-scheme cross-portfolio comparison */}
      {perScheme.length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
            <div style={{fontFamily:'Syne',fontSize:15,fontWeight:800,color:'#fff'}}>Same scheme across portfolios</div>
            <button className="btn" onClick={()=>{
              const ports=perScheme._ports||[];

        Returns basis: <b style={{color:C.text}}>{returnBasis==='book'?'Book Cost (FIFO)':returnBasis==='net'?'Net Deployed':'Gross Invested'}</b>.
        XIRR and NPV are always cash-flow based, unaffected by basis.

  );

// ── Google Drive Sync ──────────────────────────────────────────
const GDRIVE_CLIENT_ID='';  // Set by user in Settings
const GDRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const GDRIVE_FOLDER_KEY='mfa_gdrive_folder';
const GDRIVE_TOKEN_KEY='mfa_gdrive_token';

function getGDriveToken(){try{const r=_store.get(GDRIVE_TOKEN_KEY);return r?JSON.parse(r):null;}catch{return null;}}
function saveGDriveToken(t){try{_store.set(GDRIVE_TOKEN_KEY,JSON.stringify(t));}catch{}}
function clearGDriveToken(){try{_store.remove(GDRIVE_TOKEN_KEY);}catch{}}

async function gdriveRequest(token,method,url,body){
  const opts={method,headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(r.status===401){clearGDriveToken();throw new Error('Google session expired. Please sign in again.');}
  if(!r.ok)throw new Error('Drive API error '+r.status+': '+(await r.text()));
  return r.json();
}

async function gdriveListFolders(token){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and trashed=false");
  const url=`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=50`;
  const r=await gdriveRequest(token,'GET',url);
  return r.files||[];
}

async function gdriveUpload(token,folderId,filename,jsonStr){
  // Check if file exists
  const q=encodeURIComponent(`name='${filename}' and '${folderId}' in parents and trashed=false`);
  const chk=await gdriveRequest(token,'GET',`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  const fileId=chk.files&&chk.files[0]?chk.files[0].id:null;
  const blob=new Blob([jsonStr],{type:'application/json'});
  const meta={name:filename,...(fileId?{}:{parents:[folderId]})};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',blob);
  const url=fileId
    ?`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  const r=await fetch(url,{method:fileId?'PATCH':'POST',
    headers:{'Authorization':'Bearer '+token.access_token},body:form});
  if(!r.ok)throw new Error('Upload failed: '+(await r.text()));
  return r.json();
}

async function gdriveDownload(token,folderId,filename){
  const q=encodeURIComponent(`name='${filename}' and '${folderId}' in parents and trashed=false`);
  const chk=await gdriveRequest(token,'GET',`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  if(!chk.files||!chk.files[0])return null;
  const fileId=chk.files[0].id;
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    {headers:{'Authorization':'Bearer '+token.access_token}});
  if(!r.ok)return null;
  return r.text();
}

// Create a Drive folder (reuse an existing same-named one if present).
// Takes the token OBJECT, like the other gdrive* helpers.
async function gdriveCreateFolder(token,name,parentId){
  const nm=String(name||'').trim()||'MF Advisor';
  // Reuse an existing folder with this name to avoid duplicates.
  const pClause=parentId&&parentId!=='root'?` and '${parentId}' in parents`:'';
  const q=encodeURIComponent(`name='${nm.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false${pClause}`);
  try{
    const chk=await gdriveRequest(token,'GET',`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
    if(chk.files&&chk.files[0])return chk.files[0];
  }catch(e){/* fall through to create */}
  const meta={name:nm,mimeType:'application/vnd.google-apps.folder',
    ...(parentId&&parentId!=='root'?{parents:[parentId]}:{})};
  return gdriveRequest(token,'POST','https://www.googleapis.com/drive/v3/files?fields=id,name',meta);
}

// ── Multi-device conflict resolution helpers ──
// Fingerprint summarizes the sync-relevant content (transactions + scheme mapping) so we can
// tell whether Drive's copy or the local copy changed since the last successful sync, without
// relying on clocks being in sync across devices.
function fpOfState(data){
  if(!data)return '';
  const txKey=(data.transactions||[]).map(t=>[t.id,t.scheme,t.date,t.amount,t.units,t.txType].join('|')).sort().join(';');
  const mapKey=Object.entries(data.schemeMapping||{}).map(([k,v])=>k+':'+(v&&v.amfiCode||'')).sort().join(';');
  const s=txKey+'##'+mapKey;
  let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36)+'-'+(data.transactions||[]).length;
}
// Union-merge two portfolio snapshots (e.g. one per device). Transactions are unioned by id
// (local wins on an id collision); scheme mappings/NAV caches are merged; scalar settings prefer
// local, falling back to remote.
function mergeStates(local,remote){
  const byId=new Map();
  const put=(t)=>{const id=t.id||[t.scheme,t.date,t.amount,t.units].join('|');byId.set(id,t);};
  (remote.transactions||[]).forEach(put);
  (local.transactions||[]).forEach(put); // local wins on collision
  const navByScheme={...(remote.navByScheme||{})};
  for(const[k,arr] of Object.entries(local.navByScheme||{})){
    if(!navByScheme[k]||arr.length>=navByScheme[k].length)navByScheme[k]=arr;
  }
  return{
    v:4,savedAt:new Date().toISOString(),
    transactions:[...byId.values()],
    schemeMapping:{...(remote.schemeMapping||{}),...(local.schemeMapping||{})},
    navByScheme,
    benchmarks:(local.benchmarks&&local.benchmarks.length)?local.benchmarks:remote.benchmarks,
    country:local.country||remote.country,
    displayCurrency:local.displayCurrency||remote.displayCurrency,
    displayUnit:local.displayUnit||remote.displayUnit,
    displayFmt:local.displayFmt||remote.displayFmt,
    navRefreshInterval:local.navRefreshInterval||remote.navRefreshInterval,
    discountRate:local.discountRate||remote.discountRate,
    returnBasis:local.returnBasis||remote.returnBasis,
    enabled:[...new Set([...(local.enabled||[]),...(remote.enabled||[])])],
    period:local.period||remote.period,
    showExited:local.showExited!==undefined?local.showExited:remote.showExited,
  };
}

function GoogleDrivePanel({currentUserId,onSaveComplete,onLoadComplete,getExportData,onRestoreData,onFullRestore}){
  const C=window.C||{bg:'#04080f',surface:'#080f1c',card:'#0b1525',border:'#162035',
    text:'#e8eaf0',muted:'#607080',accent:'#00c8ff',green:'#00e676',red:'#ff5252',amber:'#ffab40'};
  const [token,setToken]=React.useState(()=>getGDriveToken());
  const [user,setUser]=React.useState(null);
  const [folders,setFolders]=React.useState([]);
  const [selectedFolder,setSelectedFolder]=React.useState(()=>_store.get(GDRIVE_FOLDER_KEY)||'');
  const [status,setStatus]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const [clientId,setClientId]=React.useState(()=>_store.get('mfa_gdrive_client_id')||'');
  const [showClientId,setShowClientId]=React.useState(false);

  const saveClientId=(id)=>{setClientId(id);_store.set('mfa_gdrive_client_id',id);};

  const signIn=()=>{
    const cid=clientId||_store.get('mfa_gdrive_client_id')||'';
    if(!cid){setStatus('Enter your Google Client ID first (see setup guide).');return;}
    if(!window.google||!window.google.accounts){setStatus('Google Identity Services not loaded. Check internet connection.');return;}
    const client=window.google.accounts.oauth2.initTokenClient({
      client_id:cid,scope:GDRIVE_SCOPE,
      callback:(resp)=>{
        if(resp.error){setStatus('Sign-in failed: '+resp.error);return;}
        const t={access_token:resp.access_token,expires_at:Date.now()+resp.expires_in*1000};
        saveGDriveToken(t);setToken(t);
        // Get user info
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',
          {headers:{'Authorization':'Bearer '+resp.access_token}})
          .then(r=>r.json()).then(u=>setUser(u)).catch(()=>{});
        setStatus('Signed in ✓');
        // Load folders
        gdriveListFolders(t).then(f=>{setFolders(f);
          const pick=_store.get('mfa_gd_folder');if(!selectedFolder&&f.length>0){const p=f.find(x=>x.id===pick)||f[0];setSelectedFolder(p.id);}
        setStatus('Signed in ✓  '+f.length+' folders found');
        }).catch(e=>setStatus('Signed in — folder error: '+e.message));
      }
    });
    client.requestAccessToken();
  };

  const signOut=()=>{
    if(token&&window.google)window.google.accounts.oauth2.revoke(token.access_token,()=>{});
    clearGDriveToken();setToken(null);setUser(null);setFolders([]);setStatus('Signed out.');
  };

  React.useEffect(()=>{
    if(token&&Date.now()>token.expires_at-60000){clearGDriveToken();setToken(null);setStatus('Session expired. Please sign in again.');}
    if(token){
      gdriveListFolders(token).then(f=>{setFolders(f);}).catch(()=>{});
    }
  },[]);

  const filename='mfa-'+currentUserId+'.json';
  const fpKey='mfa_gd_sync_fp_'+currentUserId;
  const [conflict,setConflict]=React.useState(null); // {local,remote,mode:'push'|'pull'}
  const [conflictPending,setConflictPending]=React.useState(false);
  const [resolving,setResolving]=React.useState(false);

  const applyRemote=(data)=>{
    if(onFullRestore)onFullRestore(data);
    else if(onRestoreData)onRestoreData(data);
    try{_store.set(fpKey,fpOfState(data));}catch{}
  };

  const saveToCloud=async(silent)=>{
    if(!token){if(!silent)setStatus('Please sign in first.');return;}
    if(!selectedFolder){if(!silent)setStatus('Select a Drive folder first.');return;}
    if(!silent)setLoading(true);
    setStatus(silent?'Auto-backing up to Google Drive…':'Saving to Google Drive…');
    try{
      const data=getExportData?getExportData():null;
      if(!data){setStatus('No data to save.');setLoading(false);return;}
      // Conflict check: has another device pushed a newer copy to Drive since we last synced?
      let remoteJson=null;
      try{remoteJson=await gdriveDownload(token,selectedFolder,filename);}catch{}
      if(remoteJson){
        const remoteData=JSON.parse(remoteJson);
        const remoteFp=fpOfState(remoteData);
        const baseline=_store.get(fpKey);
        if(baseline&&remoteFp!==baseline&&remoteFp!==fpOfState(data)){
          if(silent){
            setConflictPending(true);
            setStatus('⚠ Auto-backup paused — Google Drive has changes from another device. Resolve below.');
            setLoading(false);return;
          }
          setConflict({local:data,remote:remoteData,mode:'push'});setLoading(false);return;
        }
      }
      await gdriveUpload(token,selectedFolder,filename,JSON.stringify(data));
      _store.set(GDRIVE_FOLDER_KEY,selectedFolder);
      _store.set(fpKey,fpOfState(data));
      setConflictPending(false);
      const now=new Date();
      _store.set('mfa_gd_last_backup',now.toISOString());
      setLastBackup(now);
      setStatus((silent?'Auto-backup saved ✓ ':'Saved to Google Drive ✓ ')+now.toLocaleTimeString());
      if(onSaveComplete)onSaveComplete();
    }catch(e){setStatus((silent?'Auto-backup failed: ':'Save failed: ')+e.message);}
    setLoading(false);
  };

  // Automatic Drive backup — runs on an interval once signed in + folder chosen.
  const [autoOn,setAutoOn]=React.useState(()=>_store.get('mfa_gd_auto')==='1');
  const [autoMin,setAutoMin]=React.useState(()=>{const v=_store.get('mfa_gd_auto_min');return v?+v:15;});
  const [lastBackup,setLastBackup]=React.useState(()=>{const v=_store.get('mfa_gd_last_backup');return v?new Date(v):null;});
  React.useEffect(()=>{_store.set('mfa_gd_auto',autoOn?'1':'0');},[autoOn]);
  React.useEffect(()=>{_store.set('mfa_gd_auto_min',String(autoMin));},[autoMin]);
  const saveToCloudRef=React.useRef(saveToCloud);saveToCloudRef.current=saveToCloud;
  React.useEffect(()=>{
    if(!autoOn||!token||!selectedFolder)return;
    const id=setInterval(()=>{saveToCloudRef.current(true);},autoMin*60000);
    return()=>clearInterval(id);
  },[autoOn,autoMin,token,selectedFolder]);
  // Also back up once shortly after sign-in/folder pick, so a backup exists immediately.
  React.useEffect(()=>{
    if(!autoOn||!token||!selectedFolder)return;
    const t=setTimeout(()=>{saveToCloudRef.current(true);},4000);
    return()=>clearTimeout(t);
  },[autoOn,token,selectedFolder]);

  const loadFromCloud=async()=>{
    if(!token){setStatus('Please sign in first.');return;}
    if(!selectedFolder){setStatus('Select a Drive folder first.');return;}
    setLoading(true);setStatus('Checking Google Drive…');
    try{
      const json=await gdriveDownload(token,selectedFolder,filename);
      if(!json){setStatus('No saved data found in this folder.');setLoading(false);return;}
      const remoteData=JSON.parse(json);
      const localData=getExportData?getExportData():null;
      const remoteFp=fpOfState(remoteData);
      const localFp=localData?fpOfState(localData):'';
      if(remoteFp===localFp){setStatus('Already up to date ✓');setLoading(false);return;}
      const baseline=_store.get(fpKey);
      if(baseline&&localFp!==baseline&&localData&&(localData.transactions||[]).length){
        // This device changed since the last sync AND differs from Drive — real conflict.
        setConflict({local:localData,remote:remoteData,mode:'pull'});setLoading(false);return;
      }
      if(!window.confirm('Load data from Google Drive? This will replace your current data.')){setLoading(false);setStatus('');return;}
      applyRemote(remoteData);
      setStatus('Loaded from Google Drive ✓');
      if(onLoadComplete)onLoadComplete();
    }catch(e){setStatus('Load failed: '+e.message);}
    setLoading(false);
  };

  const openPendingConflict=async()=>{
    if(!token||!selectedFolder)return;
    setResolving(true);
    try{
      const remoteJson=await gdriveDownload(token,selectedFolder,filename);
      const localData=getExportData?getExportData():null;
      if(remoteJson&&localData)setConflict({local:localData,remote:JSON.parse(remoteJson),mode:'push'});
    }catch(e){setStatus('Could not load conflict details: '+e.message);}
    setResolving(false);
  };

  const resolveConflict=async(choice)=>{
    if(!conflict)return;
    const{local,remote}=conflict;
    setResolving(true);
    try{
      if(choice==='local'){
        await gdriveUpload(token,selectedFolder,filename,JSON.stringify(local));
        _store.set(fpKey,fpOfState(local));
        setStatus("Kept this device's data — pushed to Drive ✓");
      }else if(choice==='remote'){
        applyRemote(remote);
        setStatus("Kept Google Drive's data — applied on this device ✓");
      }else if(choice==='merge'){
        const merged=mergeStates(local,remote);
        applyRemote(merged);
        await gdriveUpload(token,selectedFolder,filename,JSON.stringify(merged));
        _store.set(fpKey,fpOfState(merged));
        setStatus('Merged both devices ✓ ('+merged.transactions.length+' transactions total)');
      }
      const now=new Date();_store.set('mfa_gd_last_backup',now.toISOString());setLastBackup(now);
      setConflict(null);setConflictPending(false);
    }catch(e){setStatus('Resolve failed: '+e.message);}
    setResolving(false);
  };

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:'16px 18px',marginTop:12}}>
      <div style={{fontFamily:'Syne',fontSize:14,fontWeight:700,color:'#fff',marginBottom:10}}>
        ☁ Google Drive Sync
      </div>
      {conflictPending&&!conflict&&(
        <div style={{marginBottom:12,padding:'10px 12px',background:`${C.amber}15`,border:`1px solid ${C.amber}55`,borderRadius:8,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:16}}>⚠</span>
          <span style={{fontSize:11,color:C.text,flex:1}}>Another device changed this portfolio on Google Drive. Auto-backup is paused until you resolve it.</span>
          <button className="btn" onClick={openPendingConflict} disabled={resolving}
            style={{padding:'5px 12px',background:`${C.amber}22`,border:`1px solid ${C.amber}`,color:C.amber,borderRadius:6,fontSize:11,fontWeight:600}}>
            {resolving?'Loading…':'Resolve conflict →'}
          </button>
        </div>
      )}
      {conflict&&(
        <div style={{marginBottom:14,padding:'14px 16px',background:C.bg,border:`1px solid ${C.amber}55`,borderRadius:10}}>
          <div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:6}}>⚠ Sync conflict detected</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:10,lineHeight:1.6}}>
            {conflict.mode==='push'
              ? 'Google Drive has a newer copy from another device than the one you last synced. Choose how to proceed:'
              : 'This device has unsynced changes that differ from what\'s on Google Drive. Choose how to proceed:'}
          </div>
          <div style={{display:'flex',gap:14,marginBottom:12,flexWrap:'wrap'}}>
            <div style={{fontSize:10,color:C.text}}><b>This device:</b> {(conflict.local.transactions||[]).length} transactions</div>
            <div style={{fontSize:10,color:C.text}}><b>Google Drive:</b> {(conflict.remote.transactions||[]).length} transactions, saved {conflict.remote.savedAt?new Date(conflict.remote.savedAt).toLocaleString():'—'}</div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn" onClick={()=>resolveConflict('merge')} disabled={resolving}
              style={{padding:'7px 14px',background:`${C.green}18`,border:`1px solid ${C.green}55`,color:C.green,borderRadius:6,fontSize:11,fontWeight:700}}>
              {resolving?'Working…':'⇄ Merge both (recommended)'}
            </button>
            <button className="btn" onClick={()=>resolveConflict('local')} disabled={resolving}
              style={{padding:'7px 14px',background:'transparent',border:`1px solid ${C.border}`,color:C.text,borderRadius:6,fontSize:11}}>
              Keep this device
            </button>
            <button className="btn" onClick={()=>resolveConflict('remote')} disabled={resolving}
              style={{padding:'7px 14px',background:'transparent',border:`1px solid ${C.border}`,color:C.text,borderRadius:6,fontSize:11}}>
              Keep Google Drive
            </button>
            <button className="btn" onClick={()=>setConflict(null)} disabled={resolving}
              style={{padding:'7px 14px',background:'transparent',border:'none',color:C.muted,borderRadius:6,fontSize:11}}>
              Cancel
            </button>
          </div>
          <div style={{fontSize:9,color:C.muted2||C.muted,marginTop:8,lineHeight:1.5}}>Merge unions transactions from both devices by ID (nothing is dropped); settings and mappings favor this device where they differ.</div>
        </div>
      )}
      {!token?(
        <div>
          <div style={{fontSize:10,color:C.muted,marginBottom:8}}>
            Sign in with Google to automatically save/load your portfolio data from Google Drive.
          </div>
          <div style={{marginBottom:8}}>
            <button style={{fontSize:9,color:C.accent,background:'transparent',border:'none',cursor:'pointer',padding:0,marginBottom:4}}
              onClick={()=>setShowClientId(!showClientId)}>
              {showClientId?'▲ Hide':'▼'} Google Client ID setup
            </button>
            {showClientId&&(
              <div style={{marginTop:6,padding:'8px 10px',background:`${C.surface}`,borderRadius:6,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:9,color:C.muted,marginBottom:6}}>
                  1. Go to <span style={{color:C.accent}}>console.cloud.google.com</span> → APIs & Services → Credentials<br/>
                  2. Create OAuth 2.0 Client ID (Web application)<br/>
                  3. Add <span style={{color:C.accent,fontFamily:'Space Mono'}}>https://accounts.google.com</span> as authorised JS origin<br/>
                  4. Paste your Client ID below
                </div>
                <input value={clientId} onChange={e=>saveClientId(e.target.value)}
                  placeholder="123456789-abc.apps.googleusercontent.com"
                  style={{width:'100%',padding:'6px 8px',background:C.bg,border:`1px solid ${C.border}`,
                    color:C.text,borderRadius:4,fontSize:10,fontFamily:'Space Mono',boxSizing:'border-box'}}/>
              </div>
            )}
          </div>
          <button className="btn" onClick={signIn}
            style={{padding:'7px 18px',background:`${C.accent}20`,border:`1px solid ${C.accent}`,
              color:C.accent,borderRadius:6,fontSize:11,fontWeight:600}}>
            Sign in with Google
          </button>
        </div>
      ):(
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            {user&&user.picture&&<img src={user.picture} style={{width:24,height:24,borderRadius:'50%'}} alt=""/>}
            <span style={{fontSize:11,color:'#fff'}}>{user?user.name||user.email:'Connected'}</span>

function EmailLoginScreen({onLogin}){
  const C=window.C;
  const [err,setErr]=React.useState('');
  const [email,setEmail]=React.useState('');
  const [name,setName]=React.useState('');
  const [isNew,setIsNew]=React.useState(false);
  const [showRecent,setShowRecent]=React.useState(false);
  const existing=loadUsers();
  const isHttps=window.location.protocol==='https:';

  // ── Google Sign-In (one click, no setup needed) ───────────────
  const googleSignIn=()=>{
    if(!isHttps){
      setErr('Please open from https://jayap34.github.io to use Google sign-in.');
      return;
    }
    if(!window.google||!window.google.accounts){
      setErr('Google not loaded — check internet connection.');
      return;
    }
    const cid=_store.get('mfa_gd_cid')||_store.get('mfa_gdrive_client_id')||'619259115899-tu03p0b80cj4taotbtaqrmh5b24p7sip.apps.googleusercontent.com';
    window.google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'openid email profile https://www.googleapis.com/auth/drive.file',
      callback:(resp)=>{
        if(resp.error){setErr('Google error: '+resp.error);return;}
        _store.set('mfa_gd_token',JSON.stringify({tok:resp.access_token,exp:Date.now()+resp.expires_in*1000}));
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',
          {headers:{'Authorization':'Bearer '+resp.access_token}})
          .then(r=>r.json())
          .then(u=>{
            const em=(u.email||'').toLowerCase();
            const nm=u.name||em;
            const id='u_'+em.replace(/[^a-z0-9]/g,'_').slice(0,30);
            const users=loadUsers();
            if(!users.find(x=>x.id===id))
              saveUsers([...users,{id,email:em,name:nm,picture:u.picture||'',createdAt:new Date().toISOString()}]);
            onLogin(id,nm,em);
          })
          .catch(()=>setErr('Could not get Google profile. Try again.'));
      }
    }).requestAccessToken();
  };

  // ── Email Sign-In (works locally) ────────────────────────────
  const emailSubmit=()=>{
    const em=email.trim().toLowerCase();
    // Admin passphrase — grants admin on this device and logs in as the admin portfolio.
    if(em===ADMIN_PASSPHRASE.toLowerCase()){
      try{_store.set('mfa_admin_grant','1');}catch{}
      const ae=ADMIN_EMAILS[0];
      const aid='u_'+ae.replace(/[^a-z0-9]/g,'_').slice(0,30);
      const us=loadUsers();
      if(!us.find(u=>u.id===aid))saveUsers([...us,{id:aid,email:ae,name:'Admin',createdAt:new Date().toISOString()}]);
      onLogin(aid,'Admin',ae);return;
    }
    if(!em||!em.includes('@')){setErr('Enter a valid email address');return;}
    const found=existing.find(u=>u.email===em);
    if(found){onLogin(found.id,found.name||em,em);return;}
    if(!isNew){setIsNew(true);setErr('');return;}
    if(!name.trim()){setErr('Enter your name');return;}
    const id='u_'+em.replace(/[^a-z0-9]/g,'_').slice(0,30);
    saveUsers([...existing,{id,email:em,name:name.trim(),createdAt:new Date().toISOString()}]);
    onLogin(id,name.trim(),em);
  };

  return(
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'32px 36px',
        width:'100%',maxWidth:400,boxShadow:'0 8px 40px #00000088'}}>

        {/* Header */}
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:44}}>📈</div>
          <div style={{fontSize:24,fontWeight:800,color:'#fff',fontFamily:'Syne',letterSpacing:'-0.5px'}}>MF Advisor</div>
          <div style={{fontSize:11,color:C.muted,marginTop:4}}>Personal Mutual Fund Portfolio Tracker</div>
          <div style={{display:'inline-block',marginTop:8,fontSize:9,fontFamily:'Space Mono',color:C.green,
            background:C.green+'12',border:'1px solid '+C.green+'44',borderRadius:20,padding:'2px 10px'}}>
            ● open-source · no API key · no subscription
          </div>
        </div>

        {/* Error */}
        {err&&<div style={{fontSize:11,color:'#f87171',marginBottom:12,padding:'8px 10px',
          background:'#f8717118',borderRadius:6,lineHeight:1.5}}>{err}</div>}

        {/* Google Sign-In — one click; auto-restores your portfolio from Google Drive */}
        <button onClick={googleSignIn}
          style={{width:'100%',padding:'12px',background:'#fff',
            border:'1px solid #dadce0',color:'#3c4043',borderRadius:8,fontSize:14,fontWeight:600,
            cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
            gap:12,marginBottom:8,boxShadow:'0 1px 4px #0002'}}>
          <svg width="19" height="19" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
        <div style={{fontSize:9,color:C.muted,textAlign:'center',marginBottom:14,lineHeight:1.6}}>
          {isHttps
            ?'Restores your saved portfolio from Google Drive automatically.'
            :'Tip: Google sign-in needs an https:// address (e.g. your GitHub Pages site). Email below works anywhere.'}
        </div>

        {/* Divider */}
        <div style={{display:'flex',alignItems:'center',gap:8,margin:'4px 0 12px'}}>
          <div style={{flex:1,height:1,background:C.border}}/>
          <span style={{fontSize:10,color:C.muted}}>or use your email — no key needed</span>
          <div style={{flex:1,height:1,background:C.border}}/>
        </div>

        {/* Email — fully open-source path (no keys, works offline) */}
        <input type="email" value={email}
          onChange={e=>{setEmail(e.target.value);setIsNew(false);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&emailSubmit()}
          placeholder="your@email.com"
          style={{width:'100%',padding:'11px 12px',background:C.bg,border:'1px solid '+C.border,
            color:C.text,borderRadius:7,fontSize:12,boxSizing:'border-box',
            fontFamily:'Space Mono',marginBottom:8}}/>

        {isNew&&(
          <input type="text" value={name} autoFocus
            onChange={e=>{setName(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&emailSubmit()}
            placeholder="Your full name"
            style={{width:'100%',padding:'10px 12px',background:C.bg,border:'1px solid '+C.border,
              color:C.text,borderRadius:7,fontSize:12,boxSizing:'border-box',marginBottom:8}}/>
        )}

        <button onClick={emailSubmit}
          style={{width:'100%',padding:'11px',background:C.accent+'20',
            border:'1px solid '+C.accent,color:C.accent,borderRadius:7,
            fontSize:13,fontWeight:700,cursor:'pointer',marginBottom:6}}>
          {isNew?'Create Portfolio →':'Continue with Email →'}
        </button>
        <div style={{fontSize:9,color:C.muted,textAlign:'center',marginBottom:8}}>
          Your email is the key to your portfolio. No password, no server, no signup.
        </div>

        {/* Recent portfolios — hidden by default for privacy; opt-in reveal */}
        {existing.length>0&&(
          <div style={{borderTop:'1px solid '+C.border,paddingTop:12}}>
            {!showRecent?(
              <button onClick={()=>setShowRecent(true)}
                style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'center',gap:6,padding:'7px 10px',
                  background:'transparent',border:'1px dashed '+C.border,color:C.muted,
                  borderRadius:6,fontSize:10,cursor:'pointer'}}>
                🔒 Show {existing.length} saved portfolio{existing.length>1?'s':''} on this device
              </button>
            ):(
              <>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <span style={{fontSize:9,color:C.muted,fontWeight:600,letterSpacing:'.05em'}}>SAVED ON THIS DEVICE</span>
                  <button onClick={()=>setShowRecent(false)} style={{background:'transparent',border:'none',color:C.muted,fontSize:9,cursor:'pointer',textDecoration:'underline'}}>hide</button>
                </div>
                {existing.slice(0,5).map(u=>(
                  <button key={u.id} onClick={()=>onLogin(u.id,u.name||u.email||u.id,u.email||'')}
                    style={{display:'flex',width:'100%',alignItems:'center',gap:8,padding:'7px 10px',marginBottom:4,
                      background:'transparent',border:'1px solid '+C.border,color:C.text,
                      borderRadius:6,fontSize:11,textAlign:'left',cursor:'pointer'}}>
                    {u.picture
                      ?<img src={u.picture} style={{width:20,height:20,borderRadius:'50%'}} alt=""/>
                      :<span style={{color:C.accent}}>📁</span>}
                    <span style={{flex:1,fontWeight:600}}>{u.name||u.id}</span>
                    {u.email&&<span style={{color:C.muted,fontSize:9}}>{u.email}</span>}
                  </button>
                ))}
                <div style={{fontSize:8,color:C.muted2,marginTop:4,lineHeight:1.5}}>These are stored only in this browser. Sign in with email or Google above to open one.</div>
              </>
            )}
          </div>
        )}

        <div style={{fontSize:9,color:C.muted,textAlign:'center',marginTop:12,lineHeight:1.7}}>
          Saved on this device (localStorage + IndexedDB) · v{APP_VERSION} · open-source
        </div>
      </div>
    </div>
  );
}

/* ── SIP future value with optional annual step-up ─────────────────── */
function sipFV(monthly,years,annretPct,stepUpPct){
  const r=annretPct/100/12; const n=Math.round(years*12);
  let bal=0, invested=0, p=monthly;
  const yearly=[];
  for(let m=1;m<=n;m++){
    bal=bal*(1+r)+p; invested+=p;
    if(m%12===0){
      yearly.push({year:m/12,bal,invested});
      p=p*(1+(stepUpPct||0)/100); // step up SIP each year
    }
  }
  if(n%12!==0)yearly.push({year:+(n/12).toFixed(1),bal,invested});
  return{fv:bal,invested,yearly};
}
/* required monthly SIP to reach a target corpus */
function sipRequired(target,years,annretPct,stepUpPct){
  // binary search on monthly amount
  let lo=0,hi=1e7;
  for(let i=0;i<60;i++){const mid=(lo+hi)/2; (sipFV(mid,years,annretPct,stepUpPct).fv<target)?(lo=mid):(hi=mid);}
  return (lo+hi)/2;
}

/* ══════════ PLANNING PAGE — F116 (SIP/SWP) + F117 (Goal) ══════════ */
function PlanningPage({fundStats,totalPortVal}){
  const [tab,setTab]=useState('sip');
  // SIP
  const [sMonthly,setSMonthly]=useState('15000');
  const [sYears,setSYears]=useState('15');
  const [sRet,setSRet]=useState('12');
  const [sStep,setSStep]=useState('0');
  const sip=useMemo(()=>sipFV(+sMonthly||0,+sYears||0,+sRet||0,+sStep||0),[sMonthly,sYears,sRet,sStep]);
  // SWP
  const [wCorpus,setWCorpus]=useState(String(Math.round(totalPortVal||5000000)));
  const [wMonthly,setWMonthly]=useState('40000');
  const [wRet,setWRet]=useState('8');
  const swp=useMemo(()=>{
    const r=(+wRet||0)/100/12; let bal=+wCorpus||0; const W=+wMonthly||0;
    const series=[]; let m=0; let totalDrawn=0;
    while(bal>0&&m<1200){ bal=bal*(1+r)-W; m++; totalDrawn+=W; if(bal<0)bal=0; if(m%12===0||bal<=0)series.push({year:Math.ceil(m/12),bal}); }
    return{months:m,years:+(m/12).toFixed(1),endBal:bal,totalDrawn,series,lastsForever:m>=1200};
  },[wCorpus,wMonthly,wRet]);
  // Goal
  const [gTarget,setGTarget]=useState('20000000');
  const [gYears,setGYears]=useState('15');
  const [gRet,setGRet]=useState('12');
  const [gStep,setGStep]=useState('5');
  const [gSeed,setGSeed]=useState(String(Math.round(totalPortVal||0)));
  const goal=useMemo(()=>{
    const T=+gTarget||0, Y=+gYears||0, e=(+gRet||0)/100, seed=+gSeed||0;
    const seedFV=seed*Math.pow(1+e,Y);
    const remaining=Math.max(0,T-seedFV);
    const reqMonthly=remaining>0?sipRequired(remaining,Y,+gRet||0,+gStep||0):0;
    return{seedFV,remaining,reqMonthly,seedCoversAll:seedFV>=T};
  },[gTarget,gYears,gRet,gStep,gSeed]);

  const TAB=[['sip','SIP Calculator'],['swp','SWP / Withdrawal'],['goal','Goal Planner']];
  return(
    <div style={{padding:'20px 24px',maxWidth:1100}}>

      <div style={{display:'flex',gap:6,marginBottom:18,flexWrap:'wrap'}}>
        {TAB.map(([k,l])=>(
          <button key={k} className="btn" onClick={()=>setTab(k)}
            style={{padding:'7px 15px',borderRadius:8,fontSize:12,fontWeight:tab===k?700:500,
              background:tab===k?C.accent+'1c':'transparent',border:'1px solid '+(tab===k?C.accent:C.border),color:tab===k?C.accent:C.muted}}>{l}</button>
        ))}
      </div>

      {tab==='sip'&&(
        <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:20,alignItems:'start'}}>
          <div style={{...F_CARD(),display:'flex',flexDirection:'column',gap:13}}>
            <FNum label="Monthly SIP amount" value={sMonthly} onChange={setSMonthly} suffix="₹"/>
            <FNum label="Investment period" value={sYears} onChange={setSYears} suffix="yrs"/>
            <FNum label="Expected annual return" value={sRet} onChange={setSRet} suffix="%"/>
            <FNum label="Annual step-up (optional)" value={sStep} onChange={setSStep} suffix="%"/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
              <FStat label="Projected corpus" value={INR(sip.fv)} color={C.green}/>
              <FStat label="Total invested" value={INR(sip.invested)} color={C.accent}/>
              <FStat label="Wealth gained" value={INR(sip.fv-sip.invested)} color={C.amber} sub={sip.invested>0?PCT((sip.fv-sip.invested)/sip.invested*100,0)+' growth':''}/>
            </div>
            <div style={F_CARD()}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Corpus growth (invested vs value)</div>
              <MiniBars data={sip.yearly.filter((_,i)=>sip.yearly.length<=15||i%Math.ceil(sip.yearly.length/15)===0).map(y=>({l:'Y'+y.year,v:y.bal,c:C.green}))} fmt={INR}/>
            </div>
            <div style={{fontSize:10,color:C.muted2,lineHeight:1.6}}>SIP invested at the start of each month; step-up raises the amount once a year. Returns compounded monthly. Illustrative only.</div>
          </div>
        </div>
      )}

      {tab==='swp'&&(
        <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:20,alignItems:'start'}}>
          <div style={{...F_CARD(),display:'flex',flexDirection:'column',gap:13}}>
            <FNum label="Starting corpus" value={wCorpus} onChange={setWCorpus} suffix="₹"/>

/* ══════════ TAX — F118: FIFO STCG/LTCG per fund per FY ══════════ */
function computeTaxLots(scheme,sortedTxns,opts){
  const lots=[]; const realised=[];
  // G20: equity LTCG grandfathering — for units bought on/before 31-Jan-2018,
  // cost = max(actual cost, min(FMV on 31-Jan-2018, sale price)). Needs NAV.
  const GF_DATE=new Date(2018,0,31);
  const isEq=opts&&opts.isEquity;
  const fmv311=(isEq&&opts.navArr)?getNav(opts.navArr,GF_DATE):null;
  for(const t of sortedTxns){
    if(t.scheme!==scheme)continue;
    const c=clf(t.txType); const u=resolveUnits(t); const amt=Math.abs(t.amount||0);
    const price=t.price||(u>0?amt/u:0);
    const date=t.date instanceof Date?t.date:new Date(t.date);
    if(c==='buy'||c==='switchin'||c==='dreinvest'){ if(u>0.0001)lots.push({units:u,price,date}); }
    else if(c==='sell'||c==='switchout'){
      let rem=u; const sellPrice=u>0?amt/u:price;
      while(rem>0.0001&&lots.length){
        const lot=lots[0]; const take=Math.min(rem,lot.units);
        let costPrice=lot.price, gf=false;
        if(fmv311&&fmv311>0&&lot.date<=GF_DATE){ // grandfathered cost basis
          costPrice=Math.max(lot.price,Math.min(fmv311,sellPrice)); gf=costPrice!==lot.price;
        }
        const gain=take*(sellPrice-costPrice);
        const days=Math.round((date-lot.date)/86400000);
        realised.push({buyDate:lot.date,sellDate:date,units:take,cost:take*costPrice,proceeds:take*sellPrice,gain,days,fy:getIndiaFY(date),grandfathered:gf});
        lot.units-=take; rem-=take; if(lot.units<=0.0001)lots.shift();
      }
    }
  }
  return realised;
}

    const rows=[]; // {scheme, isEquity, fy, stcg, ltcg, lots[]}
    for(const name of names){
      const isEq=['Equity','Hybrid'].includes(getAssetClass(name));
      const realised=computeTaxLots(name,sortedTxns,{isEquity:isEq,navArr:navByScheme&&navByScheme[name]}).filter(r=>Math.abs(r.gain)>0.01);
      if(!realised.length)continue;
      const byFy={};
      for(const r of realised){
        const longTerm=isEq?r.days>365:r.days>1095;
        byFy[r.fy]=byFy[r.fy]||{fy:r.fy,stcg:0,ltcg:0,n:0};
        if(longTerm)byFy[r.fy].ltcg+=r.gain; else byFy[r.fy].stcg+=r.gain;
        byFy[r.fy].n++;
      }
      rows.push({scheme:name,isEquity:isEq,fys:Object.values(byFy).sort((a,b)=>a.fy<b.fy?1:-1)});
    }
    // aggregate by FY across funds
    const fyAgg={};
    for(const row of rows)for(const f of row.fys){

      if(row.isEquity){fyAgg[f.fy].eqST+=f.stcg;fyAgg[f.fy].eqLT+=f.ltcg;}

    const fyList=Object.values(fyAgg).sort((a,b)=>a.fy<b.fy?1:-1).map(f=>{
      const eqLTtax=Math.max(0,f.eqLT-EQ_EXEMPT)*(+eqLT/100);

      const debtTax=Math.max(0,f.debtST+f.debtLT)*(+slab/100); // post-Apr-2023 debt = slab
      return{...f,eqLTtax,eqSTtax,debtTax,totalTax:eqLTtax+eqSTtax+debtTax,totalGain:f.eqST+f.eqLT+f.debtST+f.debtLT};
    });
    return{rows,fyList};

  return(

      <div style={{fontSize:11,color:C.muted,marginBottom:14}}>Realised STCG / LTCG per financial year, computed FIFO from your redemptions. Holding period: equity &gt; 12 months = long-term, debt &gt; 36 months. Rates are editable assumptions.</div>

      <div style={{...F_CARD(),borderColor:C.amber+'33',marginBottom:14,fontSize:11,color:C.muted,lineHeight:1.6}}>
        <b style={{color:C.amber}}>⚠ Not tax advice.</b> Tax law changes (e.g. equity STCG 20% &amp; LTCG 12.5% with a ₹1.25L exemption from 23 Jul 2024; debt funds bought after 1 Apr 2023 are taxed at your slab). FIFO here may differ from your broker's method. Equity units bought on/before 31 Jan 2018 use grandfathered cost (NAV on that date) where NAV is available. Verify with a professional before filing.
      </div>

      <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:16}}>
        {[['Equity LTCG %',eqLT,setEqLT],['Equity STCG %',eqST,setEqST],['Debt / slab %',slab,setSlab]].map(([l,v,set])=>(
          <div key={l} style={{width:140}}><FNum label={l} value={v} onChange={set} suffix="%"/></div>
        ))}
      </div>

      {data.fyList.length===0?(
        <div style={{...F_CARD(),color:C.muted,fontSize:12}}>No realised gains found — you haven't recorded any redemptions/switch-outs for the enabled funds yet. STCG/LTCG appears here once you sell.</div>
      ):(
        <>
          <div style={{...F_CARD(),marginBottom:16,overflowX:'auto'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontFamily:'Syne',fontSize:14,fontWeight:700,color:'#fff'}}>Per financial year</div>
              <button className="btn" onClick={()=>downloadXLSX(data.fyList.map(f=>[f.fy,Math.round(f.eqST),Math.round(f.eqLT),Math.round(f.debtST+f.debtLT),Math.round(f.totalGain),Math.round(f.totalTax)]),['FY','Equity STCG','Equity LTCG','Debt gains','Total gain','Est. tax'],'tax-by-fy.xlsx','Tax by FY')} style={{padding:'4px 11px',background:'transparent',border:'1px solid '+C.border,color:C.muted,borderRadius:6,fontSize:10}}>↓ Excel</button>
            </div>
            <table style={{width:'100%',borderCollapse:'collapse',minWidth:680}}>
              <thead><tr>

            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {data.rows.map(row=>(
                <div key={row.scheme} style={{borderBottom:'1px solid '+C.border+'88',paddingBottom:9}}>

                  </div>

              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );

/* ════════════════════════════════════════════════════════════════════
   MARKET ANALYSIS MODULE (v6.5)
   Equity allocation → market-cap & sector (modeled from fund category),
   risk-profile inputs, and reallocation recommendations.
   Spliced into the main babel scope: getAssetClass, deriveCategory, getAMC,
   INR, PCT, C, downloadXLSX, F_CARD, _store … are already in scope.
   DATA NOTE: the free AMFI/mfapi API gives NAV only — not factsheet holdings.
   So stock/sector weights here are MODELED from each fund's category using
   representative Indian-market profiles, clearly labeled as such.
═══════════════════════════════════════════════════════════════════════ */

// Market-cap split per fund category (large / mid / small), % of equity.
const CAP_MODEL={
  'Index/ETF':[85,12,3],'Large Cap':[85,12,3],'Large & Mid':[50,42,8],
  'Flexi/Multi Cap':[64,22,14],'ELSS':[64,22,14],'Mid Cap':[10,73,17],
  'Small Cap':[6,24,70],'Sectoral/Thematic':[60,28,12],'Equity (other)':[60,25,15],
  'Hybrid':[70,22,8],
};
// Representative broad-market sector weights (~Nifty 500, approx 2024-25), %.
const BROAD_SECTORS={
  'Financials':32,'Information Technology':11,'Oil, Gas & Energy':10,'FMCG':7,
  'Automobile':7,'Healthcare & Pharma':6,'Capital Goods':7,'Metals & Mining':4,
  'Construction & Infra':4,'Power & Utilities':3,'Telecom':3,'Chemicals':3,
  'Consumer Durables':2,'Others':1,
};
// Sectoral/thematic funds tilt heavily to one sector — keyword → sector.
const THEME_SECTOR=[
  [/bank|financ|psu bank/,'Financials'],[/tech|digital|it /,'Information Technology'],
  [/pharma|health/,'Healthcare & Pharma'],[/fmcg|consum/,'FMCG'],[/auto/,'Automobile'],
  [/infra|construct/,'Construction & Infra'],[/energy|oil|gas|power/,'Oil, Gas & Energy'],
  [/metal/,'Metals & Mining'],[/manufactur/,'Capital Goods'],[/realty|real estate/,'Construction & Infra'],
];
function sectorWeightsFor(name){
  const cat=deriveCategory(name);
  if(cat==='Sectoral/Thematic'){
    const n=name.toLowerCase();
    for(const [re,sec] of THEME_SECTOR){if(re.test(n)){
      const w={...BROAD_SECTORS};Object.keys(w).forEach(k=>w[k]=w[k]*0.25);w[sec]=(w[sec]||0)+62;
      const tot=Object.values(w).reduce((a,b)=>a+b,0);Object.keys(w).forEach(k=>w[k]=w[k]/tot*100);return w;
    }}
  }
  return {...BROAD_SECTORS};
}
const isEquityClass=name=>['Equity','Hybrid'].includes(getAssetClass(name));

// Risk-profile presets: target asset mix + within-equity cap split.
const RISK_PROFILES={
  conservative:{label:'Conservative',equity:30,debt:60,gold:10,cap:[80,15,5],
    note:'Capital protection. Short horizon (<3y) or low risk tolerance.'},
  moderate:{label:'Moderate',equity:60,debt:32,gold:8,cap:[65,25,10],
    note:'Balanced growth. 3–7 year horizon.'},
  aggressive:{label:'Aggressive — High Growth',equity:80,debt:12,gold:8,cap:[50,30,20],
    note:'Growth focus. 7+ year horizon, comfortable with volatility.'},
  veryAggressive:{label:'Very Aggressive',equity:92,debt:3,gold:5,cap:[40,32,28],
    note:'Maximum growth. 10+ year horizon, high risk tolerance.'},
};
function loadProfile(uid){
  try{const r=_store.get('mfa_market_profile_'+(uid||'x'));if(r)return JSON.parse(r);}catch{}
  return {key:'moderate',...RISK_PROFILES.moderate,custom:false};
}
function saveProfile(uid,p){try{_store.set('mfa_market_profile_'+(uid||'x'),JSON.stringify(p));}catch{}}

const SEC_COLORS=['#00c8ff','#00e676','#ffab00','#c084fc','#ff5252','#00bfa5','#ff9e80','#7c4dff','#64dd17','#f06292','#4dd0e1','#ffd54f','#90a4ae','#ba68c8'];

function MarketAnalysisPage({fundStats,currentUserId}){
  const [prof,setProf]=useState(()=>loadProfile(currentUserId));
  const applyPreset=(k)=>{const p={key:k,...RISK_PROFILES[k],custom:false};setProf(p);saveProfile(currentUserId,p);};
  const setField=(field,val)=>{const p={...prof,key:'custom',custom:true,[field]:val};setProf(p);saveProfile(currentUserId,p);};
  const setCap=(i,val)=>{const cap=[...prof.cap];cap[i]=val;const p={...prof,key:'custom',custom:true,cap};setProf(p);saveProfile(currentUserId,p);};

  // ── Current portfolio breakdown ───────────────────────────────────
  const held=useMemo(()=>fundStats.filter(f=>f.currentVal>10),[fundStats]);
  const totalVal=held.reduce((s,f)=>s+f.currentVal,0)||1;
  const analysis=useMemo(()=>{
    let equityVal=0,debtVal=0,goldVal=0;
    const cap={large:0,mid:0,small:0};const sectors={};
    for(const f of held){
      const cls=getAssetClass(f.name);
      if(cls==='Debt'||cls==='Liquid'){debtVal+=f.currentVal;continue;}
      if(/gold|silver|commodit/i.test(f.name)){goldVal+=f.currentVal;continue;}
      // equity / hybrid → split. Hybrid: ~70% of value treated as equity.
      const eqFrac=cls==='Hybrid'?0.70:1;const eqV=f.currentVal*eqFrac;
      debtVal+=f.currentVal*(1-eqFrac);
      equityVal+=eqV;
      const capM=CAP_MODEL[deriveCategory(f.name)]||[60,25,15];
      cap.large+=eqV*capM[0]/100;cap.mid+=eqV*capM[1]/100;cap.small+=eqV*capM[2]/100;
      const sw=sectorWeightsFor(f.name);
      for(const [s,w] of Object.entries(sw))sectors[s]=(sectors[s]||0)+eqV*w/100;
    }
    return {equityVal,debtVal,goldVal,cap,sectors,eqTotal:cap.large+cap.mid+cap.small||1};
  },[held]);

  // ── Target vs current → reallocation ──────────────────────────────
  const reco=useMemo(()=>{
    const tEq=totalVal*prof.equity/100,tDebt=totalVal*prof.debt/100,tGold=totalVal*prof.gold/100;
    const rows=[
      {k:'Equity',cur:analysis.equityVal,tgt:tEq},
      {k:'Debt / Liquid',cur:analysis.debtVal,tgt:tDebt},
      {k:'Gold / Commodity',cur:analysis.goldVal,tgt:tGold},
    ].map(r=>({...r,delta:r.tgt-r.cur,curPct:r.cur/totalVal*100,tgtPct:r.tgt/totalVal*100}));
    // within-equity cap targets
    const capRows=[['Large Cap',0],['Mid Cap',1],['Small Cap',2]].map(([l,i])=>{
      const cur=[analysis.cap.large,analysis.cap.mid,analysis.cap.small][i];
      const tgt=analysis.eqTotal*prof.cap[i]/100;
      return {k:l,cur,tgt,delta:tgt-cur,curPct:cur/analysis.eqTotal*100,tgtPct:prof.cap[i]};
    });
    return {rows,capRows};
  },[analysis,prof,totalVal]);

  const capSum=prof.cap[0]+prof.cap[1]+prof.cap[2];
  const mixSum=prof.equity+prof.debt+prof.gold;
  const capItems=[{l:'Large Cap',v:analysis.cap.large,c:SEC_COLORS[0]},{l:'Mid Cap',v:analysis.cap.mid,c:SEC_COLORS[2]},{l:'Small Cap',v:analysis.cap.small,c:SEC_COLORS[4]}];
  const sectorItems=Object.entries(analysis.sectors).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([l,v],i)=>({l,v,c:SEC_COLORS[i%SEC_COLORS.length]}));
  const fmtDelta=(d)=>Math.abs(d)<totalVal*0.01?<span style={{color:C.green}}>✓ on target</span>:<span style={{color:d>0?C.teal:C.amber}}>{d>0?'add ':'trim '}{INR(Math.abs(d))}</span>;

  return(
    <div style={{padding:'20px 24px',maxWidth:1120}}>
      <div style={{fontFamily:'Syne',fontSize:20,fontWeight:800,color:'#fff'}}>Market Analysis &amp; Reallocation</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:14}}>Equity broken down by market-cap and sector, compared against your risk profile, with suggested reallocation. Set your profile below.</div>

      <div style={{...F_CARD(),borderColor:C.amber+'33',marginBottom:16,fontSize:11,color:C.muted,lineHeight:1.6}}>
        <b style={{color:C.amber}}>⚠ Modeled, not factsheet holdings.</b> The free AMFI/MFAPI feed provides NAV only — not each fund's actual stock list. Market-cap &amp; sector weights here are <i>estimated</i> from each fund's category using representative Indian-market profiles. Treat them as directional, not exact. Stock-level holdings would require a paid holdings dataset or your AMC factsheets.
      </div>

      {/* PROFILE INPUTS */}
      <div style={{...F_CARD(),marginBottom:18}}>
        <div style={{fontFamily:'Syne',fontSize:14,fontWeight:700,color:'#fff',marginBottom:10}}>Your investor profile</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
          {Object.entries(RISK_PROFILES).map(([k,p])=>(
            <button key={k} className="btn" onClick={()=>applyPreset(k)}
              style={{padding:'8px 13px',borderRadius:8,fontSize:12,fontWeight:prof.key===k?700:500,
                background:prof.key===k?C.accent+'1c':'transparent',border:'1px solid '+(prof.key===k?C.accent:C.border),color:prof.key===k?C.accent:C.muted}}>{p.label}</button>
          ))}
          {prof.custom&&<span style={{alignSelf:'center',fontSize:10,color:C.teal,fontFamily:'Space Mono'}}>● custom</span>}
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:14}}>{RISK_PROFILES[prof.key]?.note||'Custom targets.'}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
          <div>
            <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:8,letterSpacing:'.04em'}}>ASSET MIX TARGET {mixSum!==100&&<span style={{color:C.amber}}>(={mixSum}%, should be 100)</span>}</div>
            {[['Equity','equity',C.green],['Debt / Liquid','debt',C.accent],['Gold','gold',C.amber]].map(([l,f,col])=>(
              <div key={f} style={{display:'flex',alignItems:'center',gap:10,marginBottom:9}}>
                <span style={{fontSize:11,color:C.text,width:96}}>{l}</span>
                <input type="range" min="0" max="100" step="1" value={prof[f]} onChange={e=>setField(f,+e.target.value)} style={{flex:1,accentColor:col}}/>
                <span style={{fontFamily:'Space Mono',fontSize:12,color:col,width:38,textAlign:'right'}}>{prof[f]}%</span>
              </div>
            ))}
          </div>
          <div>
            <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:8,letterSpacing:'.04em'}}>WITHIN-EQUITY CAP SPLIT {capSum!==100&&<span style={{color:C.amber}}>(={capSum}%, should be 100)</span>}</div>
            {[['Large Cap',0],['Mid Cap',1],['Small Cap',2]].map(([l,i])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:10,marginBottom:9}}>
                <span style={{fontSize:11,color:C.text,width:96}}>{l}</span>
                <input type="range" min="0" max="100" step="1" value={prof.cap[i]} onChange={e=>setCap(i,+e.target.value)} style={{flex:1,accentColor:SEC_COLORS[i*2]}}/>
                <span style={{fontFamily:'Space Mono',fontSize:12,color:SEC_COLORS[i*2],width:38,textAlign:'right'}}>{prof.cap[i]}%</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {totalVal<=1?(

function deriveCategory(name){
  const n=name.toLowerCase();
  if(/index|nifty|sensex|etf/.test(n))return 'Index/ETF';
  if(/elss|tax saver|long term equity/.test(n))return 'ELSS';
  if(/small\s*cap/.test(n))return 'Small Cap';
  if(/mid\s*cap/.test(n))return 'Mid Cap';
  if(/large\s*&?\s*mid|large and mid/.test(n))return 'Large & Mid';
  if(/large\s*cap|bluechip|top 100|focused/.test(n))return 'Large Cap';
  if(/flexi\s*cap|multi\s*cap|multicap/.test(n))return 'Flexi/Multi Cap';
  if(/pharma|bank|tech|infra|consum|energy|fmcg|digital|manufactur|psu equity|sector/.test(n))return 'Sectoral/Thematic';
  if(/liquid|overnight|money market|ultra short/.test(n))return 'Liquid/Money Mkt';
  if(/debt|bond|gilt|credit|income|duration|corporate bond/.test(n))return 'Debt';
  if(/hybrid|balanced|equity savings|multi asset|dynamic asset|advantage/.test(n))return 'Hybrid';
  if(/gold|silver|commodity/.test(n))return 'Gold/Commodity';
  return 'Equity (other)';
}
const ALLOC_COLORS=['#00c8ff','#00e676','#ffab00','#c084fc','#ff5252','#00bfa5','#ff9e80','#7c4dff','#64dd17','#f06292','#4dd0e1','#ffd54f'];

function ConcentrationView({fundStats}){
  const held=useMemo(()=>fundStats.filter(f=>f.currentVal>10),[fundStats]);
  const total=held.reduce((s,f)=>s+f.currentVal,0)||1;
  // AMC concentration
  const amcMap={}; for(const f of held){const a=getAMC(f.name); amcMap[a]=(amcMap[a]||0)+f.currentVal;}
  const amcs=Object.entries(amcMap).sort((a,b)=>b[1]-a[1]).map(([l,v],i)=>({l,v,c:ALLOC_COLORS[i%ALLOC_COLORS.length]}));
  const topAmc=amcs[0];
  // Single-fund concentration
  const topFund=[...held].sort((a,b)=>b.currentVal-a.currentVal)[0];
  // Overlap by category cluster
  const catMap={}; for(const f of held){const k=deriveCategory(f.name); (catMap[k]=catMap[k]||[]).push(f);}
  const overlaps=Object.entries(catMap).filter(([k,fs])=>fs.length>1&&!/Liquid|Debt|Gold/.test(k))
    .map(([k,fs])=>({cat:k,funds:fs.map(x=>x.name),v:fs.reduce((s,x)=>s+x.currentVal,0)})).sort((a,b)=>b.v-a.v);
  const maxOverlap=overlaps[0];
  // HHI (Herfindahl) on funds
  const hhi=held.reduce((s,f)=>s+Math.pow(f.currentVal/total,2),0);
  const flag=(cond)=>cond?{color:C.red,txt:'⚠ High'}:{color:C.green,txt:'✓ OK'};
  const amcFlag=flag(topAmc&&topAmc.v/total>0.5);
  const fundFlag=flag(topFund&&topFund.currentVal/total>0.3);
  const ovFlag=flag(maxOverlap&&maxOverlap.v/total>0.4);
  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        <FStat label="Largest AMC" value={topAmc?(topAmc.v/total*100).toFixed(0)+'%':'—'} color={amcFlag.color} sub={topAmc?topAmc.l+' · '+amcFlag.txt:''}/>
        <FStat label="Largest single fund" value={topFund?(topFund.currentVal/total*100).toFixed(0)+'%':'—'} color={fundFlag.color} sub={fundFlag.txt+' (flag >30%)'}/>
        <FStat label="Diversification (HHI)" value={hhi.toFixed(2)} color={hhi>0.25?C.red:hhi>0.15?C.amber:C.green} sub={hhi>0.25?'concentrated':hhi>0.15?'moderate':'well spread'}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div style={F_CARD()}>
          <div style={{fontFamily:'Syne',fontSize:14,fontWeight:700,color:'#fff',marginBottom:4}}>AMC concentration</div>
          <div style={{fontSize:10,color:C.muted,marginBottom:12}}>Flag if a single AMC manages &gt; 50% of your money.</div>
          <AllocBar items={amcs} total={total}/>
        </div>
        <div style={F_CARD()}>
          <div style={{fontFamily:'Syne',fontSize:14,fontWeight:700,color:'#fff',marginBottom:4}}>Fund overlap risk</div>
          <div style={{fontSize:10,color:C.muted,marginBottom:12,lineHeight:1.5}}>Funds in the same category likely hold similar stocks. Heuristic — true overlap needs holdings data. {ovFlag.txt} (flag &gt;40% in one category).</div>
          {overlaps.length===0?<div style={{fontSize:11,color:C.green}}>✓ No two enabled funds share a category — low overlap.</div>:(
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              {overlaps.map(o=>(
                <div key={o.cat} style={{fontSize:11}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <span style={{color:o.v/total>0.4?C.red:C.text,fontWeight:600}}>{o.cat}</span>
                    <span style={{color:C.muted,fontFamily:'Space Mono'}}>{(o.v/total*100).toFixed(0)}% · {o.funds.length} funds</span>
                  </div>
                  <div style={{fontSize:9,color:C.muted2,lineHeight:1.5}}>{o.funds.join(' · ')}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
